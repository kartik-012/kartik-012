<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
    <style>
        .node {
            transform-origin: center;
            animation: pulse 4.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            10% { transform: scale(1.6); opacity: 1; }
        }
        .diamond {
            transform-origin: 600px 60px;
            animation: diamondAnim 3s infinite;
        }
        @keyframes diamondAnim {
            0%, 100% { fill: #00ff88; transform: rotate(45deg) scale(1); }
            50% { fill: #a855f7; transform: rotate(45deg) scale(1.3); }
        }
        .text-top {
            font-family: monospace;
            font-size: 11px;
            fill: #8b949e;
            animation: textTopPulse 4s infinite alternate;
        }
        @keyframes textTopPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }
        .text-bottom {
            font-family: monospace;
            font-size: 10px;
            fill: #8b949e;
            opacity: 0;
            animation: textBotFadeIn 2s forwards 1s;
        }
        @keyframes textBotFadeIn {
            to { opacity: 0.4; }
        }
        .wave {
            fill: none;
            stroke-width: 1.5;
            animation: wavePulse 2s infinite;
            opacity: 0;
        }
        @keyframes wavePulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .particle {
            fill: #e6edf3;
            opacity: 0;
            animation: floatUp 8s infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-40px); opacity: 0; }
        }
    </style>
    
    <rect width="1200" height="120" fill="#0d1117" />
    
    <!-- Particles -->
    <g>
        <circle cx="150" cy="70" r="1" class="particle" style="animation-delay: 0s" />
        <circle cx="280" cy="80" r="1.5" class="particle" style="animation-delay: 2s" />
        <circle cx="400" cy="65" r="1" class="particle" style="animation-delay: 4s" />
        <circle cx="500" cy="75" r="1.5" class="particle" style="animation-delay: 1s" />
        <circle cx="700" cy="85" r="1" class="particle" style="animation-delay: 3s" />
        <circle cx="820" cy="70" r="1.5" class="particle" style="animation-delay: 5s" />
        <circle cx="950" cy="80" r="1" class="particle" style="animation-delay: 7s" />
        <circle cx="1080" cy="65" r="1.5" class="particle" style="animation-delay: 2.5s" />
        <circle cx="350" cy="90" r="1" class="particle" style="animation-delay: 6s" />
        <circle cx="880" cy="90" r="1" class="particle" style="animation-delay: 1.5s" />
    </g>

    <!-- Center Line -->
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#161b22" stroke-width="1" />
    
    <!-- Nodes -->
    <g>
        <!-- left side -->
        <circle cx="75" cy="60" r="3.5" fill="#00ff88" class="node" style="animation-delay: 0.3s; transform-origin: 75px 60px;" />
        <circle cx="150" cy="60" r="3.5" fill="#06b6d4" class="node" style="animation-delay: 0.6s; transform-origin: 150px 60px;" />
        <circle cx="225" cy="60" r="3.5" fill="#a855f7" class="node" style="animation-delay: 0.9s; transform-origin: 225px 60px;" />
        <circle cx="300" cy="60" r="3.5" fill="#00ff88" class="node" style="animation-delay: 1.2s; transform-origin: 300px 60px;" />
        <circle cx="375" cy="60" r="3.5" fill="#06b6d4" class="node" style="animation-delay: 1.5s; transform-origin: 375px 60px;" />
        <circle cx="450" cy="60" r="3.5" fill="#a855f7" class="node" style="animation-delay: 1.8s; transform-origin: 450px 60px;" />
        <circle cx="525" cy="60" r="3.5" fill="#00ff88" class="node" style="animation-delay: 2.1s; transform-origin: 525px 60px;" />
        
        <!-- center diamond is at 600 -->
        
        <!-- right side -->
        <circle cx="675" cy="60" r="3.5" fill="#06b6d4" class="node" style="animation-delay: 2.4s; transform-origin: 675px 60px;" />
        <circle cx="750" cy="60" r="3.5" fill="#a855f7" class="node" style="animation-delay: 2.7s; transform-origin: 750px 60px;" />
        <circle cx="825" cy="60" r="3.5" fill="#00ff88" class="node" style="animation-delay: 3.0s; transform-origin: 825px 60px;" />
        <circle cx="900" cy="60" r="3.5" fill="#06b6d4" class="node" style="animation-delay: 3.3s; transform-origin: 900px 60px;" />
        <circle cx="975" cy="60" r="3.5" fill="#a855f7" class="node" style="animation-delay: 3.6s; transform-origin: 975px 60px;" />
        <circle cx="1050" cy="60" r="3.5" fill="#00ff88" class="node" style="animation-delay: 3.9s; transform-origin: 1050px 60px;" />
        <circle cx="1125" cy="60" r="3.5" fill="#06b6d4" class="node" style="animation-delay: 4.2s; transform-origin: 1125px 60px;" />
    </g>

    <!-- Signal waves around center -->
    <g style="transform-origin: 600px 60px;">
        <path d="M 585 50 Q 575 60 585 70" stroke="#00ff88" class="wave" style="animation-delay: 0s" />
        <path d="M 615 50 Q 625 60 615 70" stroke="#a855f7" class="wave" style="animation-delay: 0s" />
        <path d="M 580 40 Q 565 60 580 80" stroke="#06b6d4" class="wave" style="animation-delay: 1s" />
        <path d="M 620 40 Q 635 60 620 80" stroke="#00ff88" class="wave" style="animation-delay: 1s" />
    </g>

    <!-- Center Diamond -->
    <rect x="590" y="50" width="20" height="20" class="diamond" />

    <!-- Text -->
    <text x="600" y="45" text-anchor="middle" class="text-top">END TRANSMISSION</text>
    <text x="600" y="85" text-anchor="middle" class="text-bottom">// Built with intention. Shipped with precision.</text>
</svg>
