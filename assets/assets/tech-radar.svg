<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .ring { stroke: #161b22; stroke-width: 1; fill: none; }
      .divider { stroke: #161b22; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
      .ring-label { fill: #8b949e; font-family: monospace; font-size: 9px; }
      .quad-label { font-family: sans-serif; font-size: 14px; font-weight: bold; }
      .tech-label { fill: #e6edf3; font-family: sans-serif; font-size: 10px; }
      .conn-line { stroke: #161b22; stroke-width: 1; opacity: 0.15; stroke-dasharray: 3 3; fill: none; }
      .conn-anim { stroke: #00ff88; stroke-dasharray: 4 4; opacity: 0.4; }
      .anim-dash {
        animation: dashFlow 20s linear infinite;
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }
      .dot { animation: dotPulse 3s infinite alternate; }
      @keyframes dotPulse {
        0% { r: 4px; opacity: 0.6; }
        100% { r: 7px; opacity: 1.0; }
      }
    </style>
    
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="600" class="bg" />

  <!-- Rings -->
  <g transform="translate(450, 300)">
    <circle r="80" class="ring" />
    <circle r="150" class="ring" />
    <circle r="220" class="ring" />
    <circle r="280" class="ring" />
    
    <!-- Quadrant Dividers -->
    <line x1="-320" y1="0" x2="320" y2="0" class="divider" />
    <line x1="0" y1="-320" x2="0" y2="320" class="divider" />

    <!-- Ring Labels -->
    <text x="5" y="-75" class="ring-label">CORE</text>
    <text x="5" y="-145" class="ring-label">PROFICIENT</text>
    <text x="5" y="-215" class="ring-label">EXPERIENCED</text>
    <text x="5" y="-275" class="ring-label">EXPLORING</text>

    <!-- Quadrant Labels -->
    <text x="-310" y="-310" class="quad-label" fill="#a855f7">AI &amp; ML</text>
    <text x="160" y="-310" class="quad-label" fill="#00ff88">BACKEND &amp; SYSTEMS</text>
    <text x="-310" y="320" class="quad-label" fill="#06b6d4">DATA &amp; STORAGE</text>
    <text x="160" y="320" class="quad-label" fill="#f59e0b">FRONTEND &amp; DEVOPS</text>
  
    <!-- Pulse Ripples -->
    <circle r="0" fill="none" stroke="#00ff88" stroke-width="1">
      <animate attributeName="r" values="0; 300" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15; 0" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle r="0" fill="none" stroke="#00ff88" stroke-width="1">
      <animate attributeName="r" values="0; 300" dur="5s" begin="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15; 0" dur="5s" begin="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Radar Sweep -->
    <path d="M 0 0 L 280 -50 A 280 280 0 0 1 280 50 Z" fill="url(#sweepGrad)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite" />
    </path>

    <!-- Connection Lines -->
    <path d="M 30 -50 L 50 -120" class="conn-anim anim-dash" />
    <path d="M -50 30 L -100 80" class="conn-anim anim-dash" />
    <path d="M 120 120 L 150 180" class="conn-anim anim-dash" />

    <!-- Tech Dots - AI & ML (Top-Left) -->
    <!-- Core -->
    <circle cx="-30" cy="-40" r="5" fill="#a855f7" class="dot" style="animation-delay: 0.1s" />
    <text x="-70" y="-40" class="tech-label">Python</text>
    <circle cx="-60" cy="-20" r="5" fill="#a855f7" class="dot" style="animation-delay: 0.3s" />
    <text x="-95" y="-15" class="tech-label">LLMs</text>
    <circle cx="-50" cy="-60" r="5" fill="#a855f7" class="dot" style="animation-delay: 0.5s" />
    <text x="-80" y="-65" class="tech-label">RAG</text>
    <circle cx="-20" cy="-70" r="5" fill="#a855f7" class="dot" style="animation-delay: 0.7s" />
    <text x="-65" y="-75" class="tech-label">AI Agents</text>
    <!-- Proficient -->
    <circle cx="-100" cy="-90" r="5" fill="#a855f7" class="dot" style="animation-delay: 0.2s" />
    <text x="-150" y="-90" class="tech-label">PyTorch</text>
    <circle cx="-120" cy="-50" r="5" fill="#a855f7" class="dot" style="animation-delay: 0.4s" />
    <text x="-195" y="-45" class="tech-label">Transformers</text>
    <circle cx="-70" cy="-120" r="5" fill="#a855f7" class="dot" style="animation-delay: 0.6s" />
    <text x="-135" y="-120" class="tech-label">Embeddings</text>
    <circle cx="-130" cy="-70" r="5" fill="#a855f7" class="dot" style="animation-delay: 0.8s" />
    <text x="-195" y="-70" class="tech-label">Prompt Eng</text>
    <!-- Experienced -->
    <circle cx="-180" cy="-90" r="5" fill="#a855f7" class="dot" style="animation-delay: 0.1s" />
    <text x="-240" y="-90" class="tech-label">LangChain</text>
    <circle cx="-160" cy="-130" r="5" fill="#a855f7" class="dot" style="animation-delay: 0.3s" />
    <text x="-195" y="-135" class="tech-label">MCP</text>
    <circle cx="-100" cy="-190" r="5" fill="#a855f7" class="dot" style="animation-delay: 0.5s" />
    <text x="-160" y="-195" class="tech-label">Evaluation</text>

    <!-- BACKEND & SYSTEMS (Top-Right) -->
    <!-- Core -->
    <circle cx="30" cy="-50" r="5" fill="#00ff88" class="dot" style="animation-delay: 0.2s" />
    <text x="40" y="-45" class="tech-label">FastAPI</text>
    <circle cx="50" cy="-20" r="5" fill="#00ff88" class="dot" style="animation-delay: 0.4s" />
    <text x="60" y="-15" class="tech-label">REST APIs</text>
    <!-- Proficient -->
    <circle cx="50" cy="-120" r="5" fill="#00ff88" class="dot" style="animation-delay: 0.1s" />
    <text x="60" y="-120" class="tech-label">Node.js</text>
    <circle cx="100" cy="-90" r="5" fill="#00ff88" class="dot" style="animation-delay: 0.3s" />
    <text x="110" y="-85" class="tech-label">WebSockets</text>
    <circle cx="120" cy="-50" r="5" fill="#00ff88" class="dot" style="animation-delay: 0.5s" />
    <text x="130" y="-45" class="tech-label">Pydantic</text>
    <circle cx="80" cy="-70" r="5" fill="#00ff88" class="dot" style="animation-delay: 0.7s" />
    <text x="90" y="-65" class="tech-label">NetworkX</text>
    <!-- Experienced -->
    <circle cx="150" cy="-140" r="5" fill="#00ff88" class="dot" style="animation-delay: 0.2s" />
    <text x="160" y="-135" class="tech-label">Express.js</text>
    <circle cx="180" cy="-80" r="5" fill="#00ff88" class="dot" style="animation-delay: 0.4s" />
    <text x="190" y="-75" class="tech-label">Flask</text>

    <!-- DATA & STORAGE (Bottom-Left) -->
    <!-- Core -->
    <circle cx="-50" cy="30" r="5" fill="#06b6d4" class="dot" style="animation-delay: 0.3s" />
    <text x="-115" y="35" class="tech-label">PostgreSQL</text>
    <circle cx="-30" cy="60" r="5" fill="#06b6d4" class="dot" style="animation-delay: 0.5s" />
    <text x="-65" y="65" class="tech-label">Redis</text>
    <!-- Proficient -->
    <circle cx="-100" cy="80" r="5" fill="#06b6d4" class="dot" style="animation-delay: 0.1s" />
    <text x="-150" y="85" class="tech-label">pgvector</text>
    <circle cx="-120" cy="50" r="5" fill="#06b6d4" class="dot" style="animation-delay: 0.3s" />
    <text x="-165" y="55" class="tech-label">Qdrant</text>
    <circle cx="-70" cy="120" r="5" fill="#06b6d4" class="dot" style="animation-delay: 0.5s" />
    <text x="-125" y="125" class="tech-label">MongoDB</text>
    <circle cx="-130" cy="100" r="5" fill="#06b6d4" class="dot" style="animation-delay: 0.7s" />
    <text x="-190" y="105" class="tech-label">ChromaDB</text>
    <!-- Experienced -->
    <circle cx="-180" cy="120" r="5" fill="#06b6d4" class="dot" style="animation-delay: 0.2s" />
    <text x="-225" y="125" class="tech-label">MySQL</text>
    <circle cx="-150" cy="160" r="5" fill="#06b6d4" class="dot" style="animation-delay: 0.4s" />
    <text x="-195" y="165" class="tech-label">Neo4j</text>

    <!-- FRONTEND & DEVOPS (Bottom-Right) -->
    <!-- Core -->
    <circle cx="50" cy="50" r="5" fill="#f59e0b" class="dot" style="animation-delay: 0.4s" />
    <text x="60" y="55" class="tech-label">Docker</text>
    <circle cx="30" cy="70" r="5" fill="#f59e0b" class="dot" style="animation-delay: 0.6s" />
    <text x="40" y="75" class="tech-label">Git</text>
    <circle cx="70" cy="30" r="5" fill="#f59e0b" class="dot" style="animation-delay: 0.8s" />
    <text x="80" y="35" class="tech-label">Linux</text>
    <!-- Proficient -->
    <circle cx="120" cy="120" r="5" fill="#f59e0b" class="dot" style="animation-delay: 0.2s" />
    <text x="130" y="125" class="tech-label">React</text>
    <circle cx="90" cy="100" r="5" fill="#f59e0b" class="dot" style="animation-delay: 0.4s" />
    <text x="100" y="105" class="tech-label">Next.js</text>
    <circle cx="140" cy="70" r="5" fill="#f59e0b" class="dot" style="animation-delay: 0.6s" />
    <text x="150" y="75" class="tech-label">TypeScript</text>
    <!-- Experienced -->
    <circle cx="150" cy="180" r="5" fill="#f59e0b" class="dot" style="animation-delay: 0.3s" />
    <text x="160" y="185" class="tech-label">Three.js</text>
    <circle cx="190" cy="140" r="5" fill="#f59e0b" class="dot" style="animation-delay: 0.5s" />
    <text x="200" y="145" class="tech-label">TailwindCSS</text>
    <circle cx="180" cy="90" r="5" fill="#f59e0b" class="dot" style="animation-delay: 0.7s" />
    <text x="190" y="95" class="tech-label">Kubernetes</text>

    <!-- Center Element -->
    <circle r="8" fill="#00ff88" filter="drop-shadow(0 0 5px #00ff88)">
      <animate attributeName="r" values="6; 10" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7; 1.0" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-25" y="-15" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#00ff88">KARTIK</text>

  </g>
</svg>
