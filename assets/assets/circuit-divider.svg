<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .line { stroke: #161b22; stroke-width: 2; fill: none; }
      .hub { stroke: #00ff88; stroke-width: 2; fill: #0d1117; }
      .text-sys { fill: #8b949e; font-family: monospace; font-size: 7px; opacity: 0.3; }
      .packet { fill: #00ff88; filter: drop-shadow(0 0 2px #00ff88); }
      .packet-blue { fill: #06b6d4; filter: drop-shadow(0 0 2px #06b6d4); }
      .node-pulse { animation: pulse 3s infinite alternate; }
      .hub-pulse { animation: hubPulse 2s infinite alternate; }
      @keyframes pulse {
        0% { fill: #161b22; }
        100% { fill: #a855f7; filter: drop-shadow(0 0 2px #a855f7); }
      }
      @keyframes hubPulse {
        0% { stroke: #161b22; box-shadow: 0 0 0 transparent; }
        100% { stroke: #00ff88; filter: drop-shadow(0 0 4px #00ff88); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="40" class="bg" />

  <!-- Main horizontal bus -->
  <line x1="0" y1="20" x2="1200" y2="20" class="line" />

  <!-- Branches & Nodes -->
  <!-- Left Side -->
  <polyline points="100,20 100,10 140,10" class="line" />
  <circle cx="140" cy="10" r="3" class="node-pulse" style="animation-delay: 0.2s;" />
  <text x="145" y="12" class="text-sys">SYS</text>

  <polyline points="250,20 250,30 290,30" class="line" />
  <circle cx="290" cy="30" r="3" class="node-pulse" style="animation-delay: 0.5s;" />
  <text x="295" y="32" class="text-sys">API</text>

  <polyline points="400,20 400,12 430,12" class="line" />
  <circle cx="430" cy="12" r="3" class="node-pulse" style="animation-delay: 0.8s;" />
  <text x="435" y="14" class="text-sys">DB</text>

  <polyline points="520,20 520,32 550,32" class="line" />
  <circle cx="550" cy="32" r="3" class="node-pulse" style="animation-delay: 1.1s;" />

  <!-- Right Side -->
  <polyline points="680,20 680,10 710,10" class="line" />
  <circle cx="710" cy="10" r="3" class="node-pulse" style="animation-delay: 0.4s;" />
  <text x="715" y="12" class="text-sys">GPU</text>

  <polyline points="800,20 800,30 840,30" class="line" />
  <circle cx="840" cy="30" r="3" class="node-pulse" style="animation-delay: 0.7s;" />
  <text x="845" y="32" class="text-sys">CACHE</text>

  <polyline points="950,20 950,15 990,15" class="line" />
  <circle cx="990" cy="15" r="3" class="node-pulse" style="animation-delay: 1.0s;" />

  <polyline points="1080,20 1080,30 1110,30" class="line" />
  <circle cx="1110" cy="30" r="3" class="node-pulse" style="animation-delay: 1.3s;" />
  <text x="1115" y="32" class="text-sys">SYS</text>

  <!-- Data Packets -->
  <!-- Main Bus Left to Right -->
  <circle r="2" class="packet">
    <animate attributeName="cx" values="0; 1200" dur="4s" repeatCount="indefinite" />
    <animate attributeName="cy" values="20; 20" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle r="2" class="packet-blue">
    <animate attributeName="cx" values="0; 1200" dur="6s" repeatCount="indefinite" />
    <animate attributeName="cy" values="20; 20" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Branch Packets -->
  <circle r="2" class="packet">
    <animate attributeName="cx" values="100;100;140;140" keyTimes="0;0.3;0.6;1" dur="2s" repeatCount="indefinite" />
    <animate attributeName="cy" values="20;10;10;10" keyTimes="0;0.3;0.6;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle r="2" class="packet-blue">
    <animate attributeName="cx" values="250;250;290;290" keyTimes="0;0.3;0.6;1" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="20;30;30;30" keyTimes="0;0.3;0.6;1" dur="2.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Center Hub -->
  <g transform="translate(600, 20)">
    <!-- Expanding Signal Pulses -->
    <circle r="0" fill="none" stroke="#00ff88" stroke-width="1">
      <animate attributeName="r" values="6; 60" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="0" fill="none" stroke="#06b6d4" stroke-width="1">
      <animate attributeName="r" values="6; 80" dur="3s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0" dur="3s" begin="1.5s" repeatCount="indefinite" />
    </circle>
    <!-- Hexagon -->
    <polygon points="0,-7 6,-3.5 6,3.5 0,7 -6,3.5 -6,-3.5" class="hub hub-pulse" />
    <!-- Center Cross -->
    <line x1="-3" y1="0" x2="3" y2="0" stroke="#00ff88" stroke-width="1" />
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#00ff88" stroke-width="1" />
  </g>
</svg>
