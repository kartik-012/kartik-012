<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320">
  <defs>
    <style>
      @keyframes greenGlow {
        0%,100% { filter: drop-shadow(0 0 6px #00ff88); opacity:0.7; }
        50% { filter: drop-shadow(0 0 18px #00ff88); opacity:1; }
      }
      @keyframes actBlink {
        0%,100% { opacity:1; } 50% { opacity:0.4; }
      }
    </style>
    <filter id="gglow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="580" height="320" fill="#0d1117" rx="10"/>
  <rect x="2" y="2" width="576" height="316" rx="9" fill="none" stroke="#00ff88" stroke-width="2"
        style="animation: greenGlow 3s ease-in-out infinite;" filter="url(#gglow)"/>
  <rect x="2" y="2" width="576" height="4" rx="2" fill="#00ff88" opacity="0.7"/>

  <text x="30" y="45" font-family="'Courier New', monospace" font-size="10" fill="#8b949e" letter-spacing="2">PROJECT :: MCP-TOOLKIT</text>
  <text x="30" y="70" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#e6edf3">GitHub MCP Toolkit</text>

  <rect x="450" y="25" width="110" height="24" rx="4" fill="#00ff88" opacity="0.15" stroke="#00ff88" stroke-width="1"/>
  <text x="505" y="41" font-family="'Courier New', monospace" font-size="11" fill="#00ff88" text-anchor="middle"
        font-weight="900" style="animation: actBlink 2s ease-in-out infinite;">● ACTIVE</text>

  <line x1="30" y1="85" x2="550" y2="85" stroke="#00ff88" stroke-width="0.5" opacity="0.4"/>

  <text x="30" y="110" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">PERFORMANCE METRICS</text>
  <g font-family="'Courier New', monospace" font-size="13">
    <text x="30" y="132" fill="#00ff88">🎯 100% Intent Accuracy</text>
    <text x="30" y="155" fill="#06b6d4">🛡️ 20 Adversarial Tests Passed</text>
    <text x="30" y="178" fill="#a855f7">🔄 Saga Pattern Execution</text>
  </g>

  <line x1="30" y1="195" x2="550" y2="195" stroke="#00ff88" stroke-width="0.5" opacity="0.4"/>

  <text x="30" y="217" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">TECH STACK</text>
  <g font-family="'Courier New', monospace" font-size="12">
    <text x="30" y="240">
      <tspan fill="#00ff88">MCP Protocol</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#06b6d4">Saga Pattern</tspan>
    </text>
    <text x="30" y="263">
      <tspan fill="#a855f7">FastAPI</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#f59e0b">Docker</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#00ff88">GitHub API</tspan>
    </text>
  </g>

  <line x1="30" y1="278" x2="550" y2="278" stroke="#00ff88" stroke-width="0.5" opacity="0.4"/>
  <text x="30" y="298" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Fault-tolerant MCP server with saga-based distributed operations</text>
</svg>
