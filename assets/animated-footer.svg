        100% { transform: translateX(-1600px); }
      }
      .ticker-move {
        animation: tickerScroll 25s linear infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="80" fill="url(#foot-bg)"/>
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#foot-line)" stroke-width="2"/>

