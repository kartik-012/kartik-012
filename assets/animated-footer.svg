<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <defs>
    <linearGradient id="foot-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <linearGradient id="foot-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.8"/>
