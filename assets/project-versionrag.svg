<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320">
  <defs>
    <linearGradient id="vrag-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="vrag-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="vrag-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e2e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d1420" stop-opacity="0.5"/>
    </linearGradient>

    <style>
      .sans-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .mono-font {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Card Base -->
  <rect width="580" height="320" rx="14" fill="url(#vrag-bg)"/>
  <rect x="1" y="1" width="578" height="318" rx="13" fill="none" stroke="url(#vrag-border)" stroke-width="1.4"/>

  <!-- Top Accent Beam -->
  <rect x="1" y="1" width="578" height="3" rx="1.5" fill="#00e5ff"/>

  <!-- Header -->
  <g transform="translate(30, 36)">
    <rect width="130" height="20" rx="10" fill="#083344" stroke="#0891b2" stroke-width="0.8"/>
    <text x="65" y="14" class="mono-font" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">PRECISION RAG</text>

    <!-- Deployed Badge -->
    <g transform="translate(420, 0)">
      <rect width="100" height="22" rx="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
      <circle cx="14" cy="11" r="3.5" fill="#818cf8"/>
      <text x="24" y="15" class="mono-font" font-size="10" font-weight="800" fill="#a5b4fc">DEPLOYED</text>
    </g>

    <text x="0" y="52" class="sans-font" font-size="24" font-weight="900" fill="#ffffff">VersionRAG System</text>
    <text x="0" y="74" class="sans-font" font-size="12" font-weight="500" fill="#94a3b8">
      Zero-Hallucination Code-Aware Retrieval via AST Semantic Differencing
    </text>
  </g>

  <!-- 4 Metrics KPI Grid -->
  <g transform="translate(30, 130)">
    <!-- KPI 1 -->
    <rect width="122" height="66" rx="8" fill="url(#vrag-inner)" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="sans-font" font-size="11" font-weight="600" fill="#64748b">HALLUCINATIONS</text>
    <text x="14" y="50" class="mono-font" font-size="19" font-weight="900" fill="#00ff88">0.0%</text>

    <!-- KPI 2 -->
    <g transform="translate(132, 0)">
      <rect width="122" height="66" rx="8" fill="url(#vrag-inner)" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="24" class="sans-font" font-size="11" font-weight="600" fill="#64748b">PRECISION</text>
      <text x="14" y="50" class="mono-font" font-size="19" font-weight="900" fill="#00e5ff">98.4%</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(264, 0)">
      <rect width="122" height="66" rx="8" fill="url(#vrag-inner)" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="24" class="sans-font" font-size="11" font-weight="600" fill="#64748b">HNSW LATENCY</text>
      <text x="14" y="50" class="mono-font" font-size="19" font-weight="900" fill="#a855f7">5.4ms</text>
    </g>

    <!-- KPI 4 -->
    <g transform="translate(396, 0)">
      <rect width="124" height="66" rx="8" fill="url(#vrag-inner)" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="24" class="sans-font" font-size="11" font-weight="600" fill="#64748b">INDEX CHUNKS</text>
      <text x="14" y="50" class="mono-font" font-size="19" font-weight="900" fill="#f59e0b">2,580</text>
    </g>
  </g>

  <!-- Technical Highlights Row -->
  <g transform="translate(30, 216)">
    <text class="mono-font" font-size="11" fill="#cbd5e1">
      <tspan fill="#00e5ff">✔</tspan> Tree-sitter AST syntax chunking
      <tspan dx="16" fill="#00ff88">✔</tspan> Cross-Encoder re-ranking
    </text>
    <text y="20" class="mono-font" font-size="11" fill="#cbd5e1">
      <tspan fill="#a855f7">✔</tspan> Git commit-hash version partitioning
      <tspan dx="16" fill="#f59e0b">✔</tspan> Qdrant collection sharding
    </text>
  </g>

  <!-- Tech Stack Chips -->
  <g transform="translate(30, 276)">
    <rect width="66" height="22" rx="4" fill="#1e293b"/>
    <text x="33" y="15" class="mono-font" font-size="11" fill="#38bdf8" text-anchor="middle">Qdrant</text>

    <rect x="74" y="0" width="70" height="22" rx="4" fill="#1e293b"/>
    <text x="109" y="15" class="mono-font" font-size="11" fill="#34d399" text-anchor="middle">FastAPI</text>

    <rect x="152" y="0" width="94" height="22" rx="4" fill="#1e293b"/>
    <text x="199" y="15" class="mono-font" font-size="11" fill="#c084fc" text-anchor="middle">Cross-Encoder</text>

    <rect x="254" y="0" width="86" height="22" rx="4" fill="#1e293b"/>
    <text x="297" y="15" class="mono-font" font-size="11" fill="#fbbf24" text-anchor="middle">Tree-Sitter</text>

    <rect x="348" y="0" width="84" height="22" rx="4" fill="#1e293b"/>
    <text x="390" y="15" class="mono-font" font-size="11" fill="#cbd5e1" text-anchor="middle">PostgreSQL</text>

    <rect x="440" y="0" width="76" height="22" rx="4" fill="#1e293b"/>
    <text x="478" y="15" class="mono-font" font-size="11" fill="#cbd5e1" text-anchor="middle">PyTorch</text>
  </g>
</svg>
