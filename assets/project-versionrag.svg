<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320">
  <defs>
    <style>
      @keyframes cyanGlow {
        0%,100% { filter: drop-shadow(0 0 6px #06b6d4); opacity:0.7; }
        50% { filter: drop-shadow(0 0 18px #06b6d4); opacity:1; }
      }
      @keyframes depBlink {
        0%,100% { opacity:1; } 50% { opacity:0.4; }
      }
    </style>
    <filter id="cglow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="580" height="320" fill="#0d1117" rx="10"/>
  <rect x="2" y="2" width="576" height="316" rx="9" fill="none" stroke="#06b6d4" stroke-width="2"
        style="animation: cyanGlow 3s ease-in-out infinite;" filter="url(#cglow)"/>
  <rect x="2" y="2" width="576" height="4" rx="2" fill="#06b6d4" opacity="0.7"/>

  <text x="30" y="45" font-family="'Courier New', monospace" font-size="10" fill="#8b949e" letter-spacing="2">PROJECT :: CODE-AWARE-RAG</text>
  <text x="30" y="70" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#e6edf3">VersionRAG</text>
  <text x="155" y="70" font-family="'Courier New', monospace" font-size="13" fill="#06b6d4"> — Code-Aware RAG System</text>

  <rect x="450" y="25" width="110" height="24" rx="4" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
  <text x="505" y="41" font-family="'Courier New', monospace" font-size="11" fill="#06b6d4" text-anchor="middle"
        font-weight="900" style="animation: depBlink 2s ease-in-out infinite;">✅ DEPLOYED</text>

  <line x1="30" y1="85" x2="550" y2="85" stroke="#06b6d4" stroke-width="0.5" opacity="0.4"/>

  <text x="30" y="110" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">PERFORMANCE METRICS</text>
  <g font-family="'Courier New', monospace" font-size="13">
    <text x="30" y="132" fill="#00ff88">✨ 0.0% Hallucinations</text>
    <text x="240" y="132" fill="#06b6d4">🎯 98.4% Precision</text>
    <text x="30" y="155" fill="#f59e0b">⚡ 5.4ms HNSW Lookup</text>
    <text x="240" y="155" fill="#a855f7">📦 2580 Chunks Indexed</text>
  </g>

  <line x1="30" y1="170" x2="550" y2="170" stroke="#06b6d4" stroke-width="0.5" opacity="0.4"/>

  <text x="30" y="192" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">TECH STACK</text>
  <g font-family="'Courier New', monospace" font-size="12">
    <text x="30" y="215">
      <tspan fill="#00ff88">Qdrant</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#06b6d4">FastAPI</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#a855f7">Cross-Encoder</tspan>
    </text>
    <text x="30" y="238">
      <tspan fill="#f59e0b">AST Parser</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#00ff88">pgvector</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#06b6d4">HNSW Index</tspan>
    </text>
  </g>

  <line x1="30" y1="255" x2="550" y2="255" stroke="#06b6d4" stroke-width="0.5" opacity="0.4"/>
  <text x="30" y="277" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Version-partitioned semantic search with AST diff parsing</text>
  <text x="30" y="298" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Cross-encoder re-ranking · zero hallucination retrieval</text>
</svg>
