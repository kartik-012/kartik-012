<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
    <defs>
        <style>
            .hud-title { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; fill: #00ff88; letter-spacing: 2px; font-weight: 700; }
            .col-header { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; fill: #67e8f9; letter-spacing: 1.5px; font-weight: 700; }
            .metric-huge { font-family: 'JetBrains Mono', monospace; font-size: 38px; font-weight: 900; fill: #ffffff; }
            .metric-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; font-weight: 600; }
            .lang-name { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #e2e8f0; font-weight: 600; }
            .lang-pct { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #94a3b8; font-weight: 700; }
            .tag-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #38bdf8; font-weight: 700; }
            .status-text { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #00ff88; font-weight: 700; }

            @keyframes holoFlow {
                0% { stroke: #00ff88; }
                33% { stroke: #06b6d4; }
                66% { stroke: #a855f7; }
                100% { stroke: #00ff88; }
            }
            @keyframes pulseWave {
                0%, 100% { stroke-opacity: 0.4; }
                50% { stroke-opacity: 1; stroke: #00ff88; }
            }
            @keyframes barGrow {
                from { width: 0; }
            }
            @keyframes dotFlash {
                0%, 100% { opacity: 0.2; }
                50% { opacity: 1; }
            }
        </style>

        <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0f1d" />
            <stop offset="50%" stop-color="#0d1424" />
            <stop offset="100%" stop-color="#060a12" />
        </linearGradient>

        <linearGradient id="holoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ff88">
                <animate attributeName="stop-color" values="#00ff88;#06b6d4;#a855f7;#f43f5e;#00ff88" dur="8s" repeatCount="indefinite"/>
            </stop>
            <stop offset="50%" stop-color="#06b6d4">
                <animate attributeName="stop-color" values="#06b6d4;#a855f7;#f43f5e;#00ff88;#06b6d4" dur="8s" repeatCount="indefinite"/>
            </stop>
            <stop offset="100%" stop-color="#a855f7">
                <animate attributeName="stop-color" values="#a855f7;#f43f5e;#00ff88;#06b6d4;#a855f7" dur="8s" repeatCount="indefinite"/>
            </stop>
        </linearGradient>

        <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00ff88" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#00ff88" stop-opacity="0.0"/>
        </linearGradient>
    </defs>

    <!-- Main Card Body -->
    <rect x="10" y="10" width="980" height="300" rx="14" fill="url(#panelBg)"/>
    <rect x="10" y="10" width="980" height="300" rx="14" fill="none" stroke="url(#holoBorder)" stroke-width="2"/>

    <!-- Top Ribbon Header -->
    <g transform="translate(30, 36)">
        <circle cx="0" cy="0" r="4" fill="#00ff88">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="14" y="4" class="hud-title">GITHUB_INTELLIGENCE // REAL-TIME ACTIVITY &amp; REPO TELEMETRY</text>
        <text x="730" y="4" class="status-text">FEED: 100% ONLINE • 0 RATE_LIMITS</text>
    </g>

    <!-- Horizontal Divider -->
    <line x1="30" y1="50" x2="970" y2="50" stroke="#1e293b" stroke-width="1.5"/>

    <!-- ==================== COLUMN 1: CONTRIBUTION VELOCITY ==================== -->
    <g transform="translate(36, 75)">
        <text x="0" y="0" class="col-header">01 // VELOCITY METRICS</text>

        <g transform="translate(0, 30)">
            <text x="0" y="10" class="metric-huge">553+</text>
            <text x="0" y="32" class="metric-sub">CONTRIBUTIONS IN PAST YEAR</text>
        </g>

        <g transform="translate(160, 30)">
            <text x="0" y="10" class="metric-huge" fill="#38bdf8">15</text>
            <text x="0" y="32" class="metric-sub">PUBLIC REPOSITORIES</text>
        </g>

        <!-- Simulated Pulse Wave Area Graph -->
        <g transform="translate(0, 85)">
            <rect x="0" y="0" width="270" height="85" rx="6" fill="#060b16" stroke="#1e293b" stroke-width="1"/>
            
            <!-- Grid lines inside graph -->
            <line x1="0" y1="25" x2="270" y2="25" stroke="#0f172a" stroke-width="1"/>
            <line x1="0" y1="50" x2="270" y2="50" stroke="#0f172a" stroke-width="1"/>

            <!-- Area polygon fill -->
            <polygon points="10,75 35,70 65,65 95,68 125,50 155,30 185,15 215,20 245,35 260,75" fill="url(#waveGrad)"/>
            
            <!-- Animated path line -->
            <path d="M 10,75 L 35,70 L 65,65 L 95,68 L 125,50 L 155,30 L 185,15 L 215,20 L 245,35 L 260,75" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round">
                <animate attributeName="stroke" values="#00ff88;#06b6d4;#a855f7;#00ff88" dur="6s" repeatCount="indefinite"/>
            </path>

            <!-- Peak marker dot -->
            <circle cx="185" cy="15" r="4" fill="#00ff88">
                <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
            </circle>
            <text x="140" y="10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00ff88" font-weight="700">PEAK VELOCITY</text>
            <text x="10" y="80" class="status-text">OCT'25 — OCT'26 CONTINUOUS VELOCITY</text>
        </g>
    </g>

    <!-- Vertical Divider 1 -->
    <line x1="335" y1="65" x2="335" y2="285" stroke="#1e293b" stroke-width="1" stroke-dasharray="4, 4"/>

    <!-- ==================== COLUMN 2: CODEBASE ARCHITECTURE ==================== -->
    <g transform="translate(365, 75)">
        <text x="0" y="0" class="col-header">02 // LANGUAGE DISTRIBUTION</text>

        <!-- Python Bar -->
        <g transform="translate(0, 25)">
            <text x="0" y="0" class="lang-name">Python (Core AI / Backend)</text>
            <text x="240" y="0" class="lang-pct" text-anchor="end">75.7%</text>
            <rect x="0" y="8" width="240" height="8" rx="4" fill="#0f172a"/>
            <rect x="0" y="8" width="181" height="8" rx="4" fill="#0284c7">
                <animate attributeName="width" values="0;181" dur="1.2s" fill="freeze"/>
            </rect>
        </g>

        <!-- TypeScript Bar -->
        <g transform="translate(0, 58)">
            <text x="0" y="0" class="lang-name">TypeScript (React / Next.js)</text>
            <text x="240" y="0" class="lang-pct" text-anchor="end">19.9%</text>
            <rect x="0" y="8" width="240" height="8" rx="4" fill="#0f172a"/>
            <rect x="0" y="8" width="48" height="8" rx="4" fill="#00ff88">
                <animate attributeName="width" values="0;48" dur="1.2s" fill="freeze"/>
            </rect>
        </g>

        <!-- JavaScript Bar -->
        <g transform="translate(0, 91)">
            <text x="0" y="0" class="lang-name">JavaScript (Web &amp; Tooling)</text>
            <text x="240" y="0" class="lang-pct" text-anchor="end">2.2%</text>
            <rect x="0" y="8" width="240" height="8" rx="4" fill="#0f172a"/>
            <rect x="0" y="8" width="18" height="8" rx="4" fill="#f59e0b">
                <animate attributeName="width" values="0;18" dur="1.2s" fill="freeze"/>
            </rect>
        </g>

        <!-- SQL / Dockerfile / Other -->
        <g transform="translate(0, 124)">
            <text x="0" y="0" class="lang-name">SQL • Dockerfile • HTML/CSS</text>
            <text x="240" y="0" class="lang-pct" text-anchor="end">2.2%</text>
            <rect x="0" y="8" width="240" height="8" rx="4" fill="#0f172a"/>
            <rect x="0" y="8" width="16" height="8" rx="4" fill="#a855f7">
                <animate attributeName="width" values="0;16" dur="1.2s" fill="freeze"/>
            </rect>
        </g>

        <!-- Multi-Color Combined Stack Strip -->
        <g transform="translate(0, 160)">
            <text x="0" y="0" class="metric-sub">CODE DOMINANCE STRIP</text>
            <g transform="translate(0, 8)">
                <rect x="0" y="0" width="181" height="12" rx="3" fill="#0284c7"/>
                <rect x="183" y="0" width="48" height="12" rx="3" fill="#00ff88"/>
                <rect x="233" y="0" width="7" height="12" rx="2" fill="#f59e0b"/>
            </g>
        </g>
    </g>

    <!-- Vertical Divider 2 -->
    <line x1="640" y1="65" x2="640" y2="285" stroke="#1e293b" stroke-width="1" stroke-dasharray="4, 4"/>

    <!-- ==================== COLUMN 3: VERIFIED SYSTEM BENCHMARKS ==================== -->
    <g transform="translate(670, 75)">
        <text x="0" y="0" class="col-header">03 // MEASURED BENCHMARKS</text>

        <!-- Benchmark 1 -->
        <g transform="translate(0, 25)">
            <rect x="0" y="0" width="290" height="38" rx="6" fill="#060e1d" stroke="#1e293b" stroke-width="1"/>
            <circle cx="16" cy="19" r="4" fill="#00ff88"/>
            <text x="28" y="16" class="lang-name">MTTR Incident Correlator</text>
            <text x="28" y="30" class="metric-sub">Cascading Storms: 1-4h → 0.78s</text>
            <text x="275" y="24" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#00ff88">0.78s</text>
        </g>

        <!-- Benchmark 2 -->
        <g transform="translate(0, 70)">
            <rect x="0" y="0" width="290" height="38" rx="6" fill="#060e1d" stroke="#1e293b" stroke-width="1"/>
            <circle cx="16" cy="19" r="4" fill="#06b6d4"/>
            <text x="28" y="16" class="lang-name">VersionRAG Precision @ k=6</text>
            <text x="28" y="30" class="metric-sub">HNSW Latency @ 5.4ms Index</text>
            <text x="275" y="24" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#06b6d4">98.4%</text>
        </g>

        <!-- Benchmark 3 -->
        <g transform="translate(0, 115)">
            <rect x="0" y="0" width="290" height="38" rx="6" fill="#060e1d" stroke="#1e293b" stroke-width="1"/>
            <circle cx="16" cy="19" r="4" fill="#a855f7"/>
            <text x="28" y="16" class="lang-name">Model Context Protocol</text>
            <text x="28" y="30" class="metric-sub">Intent Accuracy (20/20 tests)</text>
            <text x="275" y="24" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#a855f7">100%</text>
        </g>

        <!-- Benchmark 4 -->
        <g transform="translate(0, 160)">
            <rect x="0" y="0" width="290" height="26" rx="6" fill="#022c22" stroke="#00ff88" stroke-width="1"/>
            <circle cx="14" cy="13" r="3" fill="#00ff88">
                <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
            </circle>
            <text x="26" y="17" class="status-text">DEPRECATED API CONTAMINATION: 0.0%</text>
        </g>
    </g>

</svg>
