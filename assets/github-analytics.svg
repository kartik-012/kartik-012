<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="ga-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="py-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>

    <linearGradient id="ts-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <linearGradient id="oth-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <style>
      .sans-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .mono-font {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
      @keyframes langBar1 { 0% { width: 0; } 100% { width: 252px; } }
      @keyframes langBar2 { 0% { width: 0; } 100% { width: 84px; } }
      @keyframes langBar3 { 0% { width: 0; } 100% { width: 84px; } }
      .lb1 { animation: langBar1 2s ease-out forwards; }
      .lb2 { animation: langBar2 2.3s ease-out forwards; }
      .lb3 { animation: langBar3 2.6s ease-out forwards; }
    </style>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#ga-bg)"/>
  <rect x="1" y="1" width="1198" height="278" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top Header Bar -->
