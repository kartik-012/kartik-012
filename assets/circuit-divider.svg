<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="85%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="div-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseFlow {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: -1200; }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      .circuit-stream {
        stroke-dasharray: 120 400;
        animation: pulseFlow 4s linear infinite;
      }
      .node-pulse {
        animation: dotPulse 2s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <rect width="1200" height="40" fill="#07090e" fill-opacity="0"/>

  <!-- Background Base Guide Line -->
  <line x1="60" y1="20" x2="1140" y2="20" stroke="url(#divider-grad)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Animated High-Speed Pulse Beam -->
  <line class="circuit-stream" x1="60" y1="20" x2="1140" y2="20" stroke="url(#pulse-grad)" stroke-width="2.5" filter="url(#div-glow)"/>

  <!-- Cybernetic Geometric Branches -->
  <g stroke="#00e5ff" stroke-width="1" fill="none" opacity="0.45">
    <polyline points="200,20 230,10 320,10"/>
    <polyline points="500,20 530,30 620,30"/>
    <polyline points="800,20 830,10 920,10"/>
  </g>

  <!-- Glowing Micro-Chips along the track -->
  <g fill="#00ff88" filter="url(#div-glow)">
    <circle cx="200" cy="20" r="3"/>
    <circle cx="320" cy="10" r="2.5" fill="#00e5ff"/>
    <circle cx="500" cy="20" r="3"/>
    <circle cx="620" cy="30" r="2.5" fill="#a855f7"/>
    <circle cx="800" cy="20" r="3"/>
    <circle cx="920" cy="10" r="2.5" fill="#00e5ff"/>
  </g>

  <!-- Central Core Hex Node -->
  <g transform="translate(600, 20)">
    <circle cx="0" cy="0" r="6" fill="#07090e" stroke="#00ff88" stroke-width="1.5"/>
    <circle class="node-pulse" cx="0" cy="0" r="3" fill="#00ff88"/>
  </g>
</svg>
