<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320">
  <defs>
    <style>
      @keyframes purpleGlow {
        0%,100% { filter: drop-shadow(0 0 6px #a855f7); opacity:0.7; }
        50% { filter: drop-shadow(0 0 18px #a855f7); opacity:1; }
      }
      @keyframes prodBlink {
        0%,100% { opacity:1; } 50% { opacity:0.4; }
      }
    </style>
    <filter id="pglow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="580" height="320" fill="#0d1117" rx="10"/>
  <!-- Purple border -->
  <rect x="2" y="2" width="576" height="316" rx="9" fill="none" stroke="#a855f7" stroke-width="2"
        style="animation: purpleGlow 3s ease-in-out infinite;" filter="url(#pglow)"/>
  <!-- Top accent line -->
  <rect x="2" y="2" width="576" height="4" rx="2" fill="#a855f7" opacity="0.7"/>

  <!-- Header -->
  <text x="30" y="45" font-family="'Courier New', monospace" font-size="10" fill="#8b949e" letter-spacing="2">PROJECT :: INCIDENT-INTELLIGENCE</text>
  <text x="30" y="70" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#e6edf3">AIOps</text>
  <text x="108" y="70" font-family="'Courier New', monospace" font-size="13" fill="#a855f7"> — Incident Intelligence Platform</text>

  <!-- Status badge -->
  <rect x="460" y="25" width="100" height="24" rx="4" fill="#a855f7" opacity="0.2" stroke="#a855f7" stroke-width="1"/>
  <text x="510" y="41" font-family="'Courier New', monospace" font-size="11" fill="#a855f7" text-anchor="middle"
        font-weight="900" style="animation: prodBlink 2s ease-in-out infinite;">⚡ PRODUCTION</text>

  <!-- Divider -->
  <line x1="30" y1="85" x2="550" y2="85" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>

  <!-- Metrics -->
  <text x="30" y="110" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">PERFORMANCE METRICS</text>
  <g font-family="'Courier New', monospace" font-size="13">
    <text x="30" y="132" fill="#00ff88">⚡ 780ms MTTR</text>
    <text x="210" y="132" fill="#06b6d4">🎯 100% RCA Accuracy</text>
    <text x="30" y="155" fill="#f59e0b">📊 30 Failure Scenarios</text>
    <text x="210" y="155" fill="#a855f7">🔗 Causal DAG Engine</text>
  </g>

  <!-- Divider -->
  <line x1="30" y1="170" x2="550" y2="170" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>

  <!-- Stack -->
  <text x="30" y="192" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">TECH STACK</text>
  <g font-family="'Courier New', monospace" font-size="12">
    <text x="30" y="215">
      <tspan fill="#00ff88">Kafka</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#06b6d4">gRPC</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#a855f7">FastAPI</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#f59e0b">pgvector</tspan>
    </text>
    <text x="30" y="238">
      <tspan fill="#00ff88">NetworkX</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#06b6d4">Redis</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#a855f7">Prometheus</tspan>
    </text>
  </g>

  <!-- Bottom description -->
  <line x1="30" y1="255" x2="550" y2="255" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>
  <text x="30" y="277" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Correlates distributed system failures with causal reasoning</text>
  <text x="30" y="298" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">EWMA anomaly detection · NetworkX DAG · KRaft Kafka</text>
</svg>
