  <text x="600" y="24" font-family="'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="3">VERIFIED CREDENTIALS · LEADERSHIP · ACHIEVEMENTS</text>
  <line x1="30" y1="32" x2="1170" y2="32" stroke="#f59e0b" stroke-width="0.5" opacity="0.4"/>

