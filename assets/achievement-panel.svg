<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320">
  <defs>
    <style>
      @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(320px); }
      }
      @keyframes fade-in {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes progress {
        0% { width: 0; }
        100% { width: 180px; }
      }
      @keyframes float-up {
        0% { transform: translateY(300px); opacity: 0; }
        10% { opacity: 0.5; }
        90% { opacity: 0.5; }
        100% { transform: translateY(50px); opacity: 0; }
      }
      @keyframes flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes signal {
        0% { stroke-opacity: 0.1; }
        50% { stroke-opacity: 0.8; }
        100% { stroke-opacity: 0.1; }
      }
      
      .scanline { animation: scanline 6s linear infinite; }
      .accent-pulse { animation: pulse 3s infinite; }
      .fade-05 { animation: fade-in 0.5s ease-out 0.5s forwards; opacity: 0; }
      .fade-10 { animation: fade-in 0.5s ease-out 1.0s forwards; opacity: 0; }
      .fade-15 { animation: fade-in 0.5s ease-out 1.5s forwards; opacity: 0; }
      .fade-20 { animation: fade-in 0.5s ease-out 2.0s forwards; opacity: 0; }
      .fade-25 { animation: fade-in 0.5s ease-out 2.5s forwards; opacity: 0; }
      .fade-30 { animation: fade-in 0.5s ease-out 3.0s forwards; opacity: 0; }
      .progress-bar { animation: progress 2s ease-out 3s forwards; width: 0; }
      .progress-text { animation: fade-in 0.5s ease-out 5s forwards; opacity: 0; }
      .float-1 { animation: float-up 8s linear infinite; }
      .float-2 { animation: float-up 12s linear infinite 2s; }
      .float-3 { animation: float-up 10s linear infinite 5s; }
      .signal-1 { animation: signal 2s infinite; }
      .signal-2 { animation: signal 2s infinite 0.5s; }
      .signal-3 { animation: signal 2s infinite 1s; }
      
      text { font-family: monospace; }
    </style>
  </defs>

  <rect width="1100" height="320" fill="#0d1117" />
  
  <rect class="scanline" width="1100" height="1" fill="#00ff88" fill-opacity="0.04" />
  <rect class="scanline" y="100" width="1100" height="1" fill="#00ff88" fill-opacity="0.04" />
  <rect class="scanline" y="200" width="1100" height="1" fill="#00ff88" fill-opacity="0.04" />

  <polygon points="15,0 1085,0 1100,15 1100,305 1085,320 15,320 0,305 0,15" fill="none" stroke="#161b22" stroke-width="1" />
  <polygon points="21,8 1079,8 1092,21 1092,299 1079,312 21,312 8,299 8,21" fill="none" stroke="#161b22" stroke-width="0.5" />
  
  <g stroke="#00ff88" stroke-width="2" fill="none" class="accent-pulse">
    <polyline points="0,30 0,0 30,0" />
    <polyline points="20,10 10,10 10,20" />
    <polyline points="1070,0 1100,0 1100,30" />
    <polyline points="1080,10 1090,10 1090,20" />
    <polyline points="1100,290 1100,320 1070,320" />
    <polyline points="1090,300 1090,310 1080,310" />
    <polyline points="30,320 0,320 0,290" />
    <polyline points="10,300 10,310 20,310" />
  </g>
  
  <g transform="translate(40, 20)" fill="none" stroke="#a855f7" stroke-width="1">
    <path d="M0,10 Q10,0 20,10" class="signal-1" />
    <path d="M-5,15 Q10,-5 25,15" class="signal-2" />
    <path d="M-10,20 Q10,-10 30,20" class="signal-3" />
  </g>
  
  <g transform="translate(1040, 20)" fill="none" stroke="#06b6d4" stroke-width="1">
    <path d="M0,10 Q10,0 20,10" class="signal-1" />
    <path d="M-5,15 Q10,-5 25,15" class="signal-2" />
    <path d="M-10,20 Q10,-10 30,20" class="signal-3" />
  </g>

  <line x1="370" y1="30" x2="370" y2="280" stroke="#161b22" stroke-dasharray="3 3" />
  <line x1="730" y1="30" x2="730" y2="280" stroke="#161b22" stroke-dasharray="3 3" />

  <circle cx="150" cy="0" r="1.5" fill="#00ff88" class="float-1" />
  <circle cx="550" cy="0" r="1.5" fill="#a855f7" class="float-2" />
  <circle cx="950" cy="0" r="1.5" fill="#f43f5e" class="float-3" />
  <circle cx="250" cy="0" r="1.5" fill="#06b6d4" class="float-3" />
  <circle cx="650" cy="0" r="1.5" fill="#f59e0b" class="float-1" />
  
  <g transform="translate(30, 40)">
    <g style="animation: pulse 2s infinite">
      <path d="M0,0 L18,0 L18,10 C18,15 9,20 9,20 C9,20 0,15 0,10 Z" fill="none" stroke="#00ff88" stroke-width="1.5" />
    </g>
    <text x="30" y="14" font-size="13" font-weight="bold" fill="#00ff88">VERIFIED CREDENTIALS</text>
    <line x1="0" y1="25" x2="330" y2="25" stroke="#161b22" stroke-width="1" />
    
    <g transform="translate(0, 50)" class="fade-05">
      <circle cx="5" cy="5" r="3" fill="#00ff88" style="animation: pulse 1s infinite" />
      <text x="15" y="8" font-size="12" fill="#e6edf3">Oracle Cloud Infrastructure</text>
      <text x="15" y="24" font-size="10" fill="#8b949e">2025 AI Foundations Associate</text>
    </g>
    
    <g transform="translate(0, 105)" class="fade-15">
      <circle cx="5" cy="5" r="3" fill="#06b6d4" style="animation: pulse 1s infinite 0.3s" />
      <text x="15" y="8" font-size="12" fill="#e6edf3">AWS Training &amp; Certification</text>
      <text x="15" y="24" font-size="10" fill="#8b949e">Fundamentals of ML &amp; AI</text>
    </g>
    
    <g transform="translate(0, 160)" class="fade-25">
      <circle cx="5" cy="5" r="3" fill="#a855f7" style="animation: pulse 1s infinite 0.6s" />
      <text x="15" y="8" font-size="12" fill="#e6edf3">Tata Group (Forage)</text>
      <text x="15" y="24" font-size="10" fill="#8b949e">GenAI-Powered Data Analytics</text>
    </g>
  </g>

  <g transform="translate(380, 40)">
    <g transform="translate(9, 9)">
      <polygon points="0,-9 2,-3 9,-3 3,2 5,8 0,5 -5,8 -3,2 -9,-3 -2,-3" fill="none" stroke="#a855f7" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite" />
      </polygon>
    </g>
    <text x="30" y="14" font-size="13" font-weight="bold" fill="#a855f7">COMMAND RANK</text>
    <line x1="0" y1="25" x2="340" y2="25" stroke="#161b22" stroke-width="1" />
    
    <text x="0" y="65" font-size="20" font-weight="bold" fill="#e6edf3" class="fade-10">VICE PRESIDENT</text>
    <text x="0" y="85" font-size="13" fill="#8b949e" class="fade-15">Department of AI &amp; ML</text>
    <text x="0" y="105" font-size="11" fill="#8b949e" class="fade-20">Jain College of Engineering, Belagavi</text>
    <text x="0" y="125" font-size="11" fill="#06b6d4" class="fade-25">B.E. Computer Science (AI &amp; ML)</text>
    
    <g transform="translate(0, 160)">
      <text x="0" y="0" font-size="11" fill="#8b949e" class="fade-25">AUTHORITY LEVEL</text>
      <rect x="0" y="10" width="200" height="6" fill="#161b22" class="fade-30" />
      <rect x="0" y="10" height="6" fill="#a855f7" class="progress-bar" />
      <text x="210" y="17" font-size="11" fill="#a855f7" class="progress-text">90%</text>
    </g>
  </g>

  <g transform="translate(740, 40)">
    <g style="animation: flash 2s infinite">
      <polyline points="10,0 0,10 8,10 4,20 16,6 8,6 12,0" fill="none" stroke="#f43f5e" stroke-width="1.5" />
    </g>
    <text x="30" y="14" font-size="13" font-weight="bold" fill="#f43f5e">HACKATHON OPS</text>
    <line x1="0" y1="25" x2="330" y2="25" stroke="#161b22" stroke-width="1" />
    
    <g transform="translate(0, 55)" class="fade-10">
      <text x="0" y="0" font-size="13" font-weight="bold" fill="#e6edf3">HACK2FUTURE 2.0</text>
      <text x="0" y="16" font-size="11" fill="#8b949e">IIIT Dharwad • Team Velora</text>
      <text x="180" y="0" font-size="14" fill="#f59e0b" style="animation: pulse 1.5s infinite">⚡</text>
    </g>
    
    <g transform="translate(0, 110)" class="fade-20">
      <text x="0" y="0" font-size="13" font-weight="bold" fill="#e6edf3">CODE FOR INNOVEX</text>
      <text x="0" y="16" font-size="11" fill="#8b949e">NITTE NMAM Institute</text>
      <text x="0" y="32" font-size="10" fill="#f59e0b">24-Hour National Sprint</text>
      <text x="180" y="0" font-size="14" fill="#00ff88" style="animation: pulse 2s infinite">⚡</text>
    </g>
  </g>

  <g transform="translate(20, 302)">
    <text x="0" y="0" font-size="10" fill="#8b949e">EDUCATION: B.E. AI&amp;ML  //  CGPA: 8.50/10  //  STATUS: ACTIVE  //  CLEARANCE: LEVEL-5 <tspan fill="#00ff88" style="animation: blink 1s infinite">█</tspan></text>
  </g>

</svg>
