  <rect width="1200" height="220" rx="14" fill="url(#ach-bg)"/>
  <rect x="1" y="1" width="1198" height="218" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top Header Bar -->
