<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <style>
      @keyframes cardGlow {
        0%,100% { opacity:0.5 }
        50% { opacity:1 }
      }
      @keyframes badgeShine {
        0%,100% { opacity:0.8 }
        50% { opacity:1 }
      }
    </style>
    <filter id="achGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="#0d1117" rx="8"/>
  <rect x="2" y="2" width="1196" height="216" rx="7" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" filter="url(#achGlow)"/>

