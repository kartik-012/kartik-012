  <text x="30" y="96" font-family="'Courier New', monospace" font-size="13" fill="#e6edf3" font-weight="700">Oracle Cloud</text>
  <text x="30" y="114" font-family="'Courier New', monospace" font-size="12" fill="#06b6d4">AI Certified</text>
  <text x="30" y="140" font-family="'Courier New', monospace" font-size="10" fill="#8b949e">OCI Generative AI</text>
  <text x="30" y="155" font-family="'Courier New', monospace" font-size="10" fill="#8b949e">Professional Track</text>
