<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320">
  <defs>
    <style>
      @keyframes orangeGlow {
        0%,100% { filter: drop-shadow(0 0 6px #f59e0b); opacity:0.7; }
        50% { filter: drop-shadow(0 0 18px #f59e0b); opacity:1; }
      }
      @keyframes resBlink {
        0%,100% { opacity:1; } 50% { opacity:0.4; }
      }
    </style>
    <filter id="oglow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="580" height="320" fill="#0d1117" rx="10"/>
  <rect x="2" y="2" width="576" height="316" rx="9" fill="none" stroke="#f59e0b" stroke-width="2"
        style="animation: orangeGlow 3s ease-in-out infinite;" filter="url(#oglow)"/>
  <rect x="2" y="2" width="576" height="4" rx="2" fill="#f59e0b" opacity="0.7"/>

  <text x="30" y="45" font-family="'Courier New', monospace" font-size="10" fill="#8b949e" letter-spacing="2">PROJECT :: RAG-BENCHMARK</text>
  <text x="30" y="70" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#e6edf3">ApexRAG</text>
  <text x="118" y="70" font-family="'Courier New', monospace" font-size="13" fill="#f59e0b"> — Benchmark Suite</text>

  <rect x="460" y="25" width="100" height="24" rx="4" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="510" y="41" font-family="'Courier New', monospace" font-size="11" fill="#f59e0b" text-anchor="middle"
        font-weight="900" style="animation: resBlink 2s ease-in-out infinite;">🔬 RESEARCH</text>

  <line x1="30" y1="85" x2="550" y2="85" stroke="#f59e0b" stroke-width="0.5" opacity="0.4"/>

  <text x="30" y="110" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">PERFORMANCE METRICS</text>
  <g font-family="'Courier New', monospace" font-size="13">
    <text x="30" y="132" fill="#00ff88">📊 85% Retrieval Accuracy</text>
    <text x="240" y="132" fill="#06b6d4">📦 2580 Chunks</text>
    <text x="30" y="155" fill="#f59e0b">🎯 Cross-Encoder Reranking</text>
    <text x="240" y="155" fill="#a855f7">📈 Multi-Strategy Eval</text>
  </g>

  <line x1="30" y1="170" x2="550" y2="170" stroke="#f59e0b" stroke-width="0.5" opacity="0.4"/>

  <text x="30" y="192" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">TECH STACK</text>
  <g font-family="'Courier New', monospace" font-size="12">
    <text x="30" y="215">
      <tspan fill="#00ff88">ChromaDB</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#06b6d4">LangChain</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#a855f7">FastAPI</tspan>
    </text>
    <text x="30" y="238">
      <tspan fill="#f59e0b">Evaluation Framework</tspan>
      <tspan fill="#8b949e"> · </tspan>
      <tspan fill="#00ff88">Cross-Encoder</tspan>
    </text>
  </g>

  <line x1="30" y1="255" x2="550" y2="255" stroke="#f59e0b" stroke-width="0.5" opacity="0.4"/>
  <text x="30" y="277" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Benchmarks RAG retrieval strategies at scale</text>
  <text x="30" y="298" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Dense · Sparse · Hybrid · Cross-Encoder comparative analysis</text>
</svg>
