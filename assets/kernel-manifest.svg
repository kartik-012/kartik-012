<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
    <defs>
        <style>
            .header-label { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; fill: #00ff88; letter-spacing: 2px; }
            .name-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
            .field-key { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; fill: #67e8f9; font-weight: 600; letter-spacing: 1px; }
            .field-val { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #e6edf3; font-weight: 500; }
            .field-val-sub { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
            .quote-text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; fill: #a5f3fc; font-style: italic; }
            .status-text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; fill: #00ff88; font-weight: 700; }
            .hex-spec { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; fill: #475569; }
            
            @keyframes scanline {
                0% { transform: translateY(0); }
                100% { transform: translateY(360px); }
            }
            @keyframes holoGlow {
                0%, 100% { stroke: #00ff88; filter: drop-shadow(0 0 6px rgba(0,255,136,0.4)); }
                33% { stroke: #06b6d4; filter: drop-shadow(0 0 6px rgba(6,182,212,0.4)); }
                66% { stroke: #a855f7; filter: drop-shadow(0 0 6px rgba(168,85,247,0.4)); }
            }
            @keyframes radarSpin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            @keyframes pulseDot {
                0%, 100% { opacity: 0.3; transform: scale(0.9); }
                50% { opacity: 1; transform: scale(1.1); }
            }
            @keyframes progressFlow {
                0% { stroke-dashoffset: 400; }
                100% { stroke-dashoffset: 0; }
            }
        </style>
        
        <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0f18" />
            <stop offset="50%" stop-color="#0d1424" />
            <stop offset="100%" stop-color="#070b12" />
        </linearGradient>

        <linearGradient id="holoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ff88">
                <animate attributeName="stop-color" values="#00ff88;#06b6d4;#a855f7;#f43f5e;#00ff88" dur="8s" repeatCount="indefinite"/>
            </stop>
            <stop offset="50%" stop-color="#06b6d4">
                <animate attributeName="stop-color" values="#06b6d4;#a855f7;#f43f5e;#00ff88;#06b6d4" dur="8s" repeatCount="indefinite"/>
            </stop>
            <stop offset="100%" stop-color="#a855f7">
                <animate attributeName="stop-color" values="#a855f7;#f43f5e;#00ff88;#06b6d4;#a855f7" dur="8s" repeatCount="indefinite"/>
            </stop>
        </linearGradient>

        <linearGradient id="quoteBar" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00ff88" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
        </linearGradient>

        <pattern id="dotGrid" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6"/>
        </pattern>
    </defs>

    <!-- Card Background with 3D Depth Layering -->
    <rect x="14" y="14" width="972" height="332" rx="14" fill="#040711" stroke="#0f172a" stroke-width="1.5" opacity="0.6"/>
    <rect x="8" y="8" width="984" height="344" rx="16" fill="url(#cardBg)"/>
    <rect x="8" y="8" width="984" height="344" rx="16" fill="url(#dotGrid)"/>

    <!-- Holographic Animated Border -->
    <rect x="8" y="8" width="984" height="344" rx="16" fill="none" stroke="url(#holoBorder)" stroke-width="2"/>

    <!-- Scanline Filter Overlay -->
    <line x1="8" y1="0" x2="992" y2="0" stroke="#00ff88" stroke-width="1.5" opacity="0.12" style="animation: scanline 5s linear infinite;"/>

    <!-- Corner Sci-Fi Bracket Accents -->
    <path d="M 20,40 L 20,20 L 40,20" stroke="#00ff88" stroke-width="2.5" fill="none"/>
    <path d="M 980,40 L 980,20 L 960,20" stroke="#00ff88" stroke-width="2.5" fill="none"/>
    <path d="M 20,320 L 20,340 L 40,340" stroke="#00ff88" stroke-width="2.5" fill="none"/>
    <path d="M 980,320 L 980,340 L 960,340" stroke="#00ff88" stroke-width="2.5" fill="none"/>

    <!-- Top Header Ribbon -->
    <g transform="translate(36, 38)">
        <circle cx="0" cy="0" r="4" fill="#00ff88">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="14" y="4" class="header-label">SYSTEM_KERNEL_SPECIFICATION // MANIFEST v2.4</text>
        <text x="750" y="4" class="hex-spec">SECURITY: ABAC-VERIFIED // LATENCY: 0.78s</text>
    </g>

    <!-- Horizontal Divider -->
    <line x1="36" y1="52" x2="964" y2="52" stroke="#1e293b" stroke-width="1.5"/>

    <!-- LEFT COLUMN: Cybernetic Holographic Reactor / Avatar Node -->
    <g transform="translate(130, 195)">
        <!-- Outer Glowing Ring -->
        <circle cx="0" cy="0" r="75" fill="#070c18" stroke="#1e293b" stroke-width="2"/>
        <circle cx="0" cy="0" r="70" fill="none" stroke="#00ff88" stroke-width="1" stroke-dasharray="6, 8" opacity="0.4" style="animation: radarSpin 20s linear infinite; transform-origin: 0px 0px;"/>
        <circle cx="0" cy="0" r="56" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="12, 16" opacity="0.6" style="animation: radarSpin 12s linear infinite reverse; transform-origin: 0px 0px;"/>
        <circle cx="0" cy="0" r="42" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8, 8" opacity="0.7" style="animation: radarSpin 8s linear infinite; transform-origin: 0px 0px;"/>
        
        <!-- Core Center Core Icon -->
        <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#00ff88" stroke-width="2"/>
        <text x="0" y="7" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#00ff88">KR</text>
        
        <!-- Pulsing Satellite Nodes -->
        <circle cx="50" cy="0" r="4" fill="#00ff88">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-50" cy="0" r="4" fill="#06b6d4">
            <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="50" r="4" fill="#a855f7">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="-50" r="4" fill="#38bdf8">
            <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
        </circle>

        <!-- Status Tag Under Reactor -->
        <rect x="-55" y="85" width="110" height="20" rx="10" fill="#022c22" stroke="#00ff88" stroke-width="1"/>
        <circle cx="-38" cy="95" r="3" fill="#00ff88">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="2" y="99" text-anchor="middle" class="status-text">KERNEL_ACTIVE</text>
    </g>

    <!-- Vertical Splitter -->
    <line x1="240" y1="65" x2="240" y2="320" stroke="#1e293b" stroke-width="1" stroke-dasharray="4, 4"/>

    <!-- RIGHT COLUMN: Professional Engineering Specs -->
    <g transform="translate(268, 68)">
        
        <!-- Row 1: Name and Title -->
        <g transform="translate(0, 20)">
            <text x="0" y="0" class="name-title">Kartik Raikar</text>
            <rect x="230" y="-18" width="120" height="22" rx="4" fill="#06253b" stroke="#0284c7" stroke-width="1"/>
            <text x="290" y="-3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" font-weight="700">AI / ML ENGINEER</text>

            <rect x="360" y="-18" width="130" height="22" rx="4" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
            <text x="425" y="-3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c084fc" font-weight="700">AGENTIC SYSTEMS</text>

            <rect x="500" y="-18" width="125" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
            <text x="562" y="-3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399" font-weight="700">RAG ARCHITECT</text>
        </g>

        <!-- Row 2: Academic & Leadership -->
        <g transform="translate(0, 52)">
            <text x="0" y="0" class="field-key">ACADEMIC // </text>
            <text x="96" y="0" class="field-val">B.E. Computer Science &amp; Engineering (AI &amp; ML) <tspan class="field-val-sub">• CGPA 8.50 / 10.00</tspan></text>
            
            <text x="0" y="24" class="field-key">AFFILIATION // </text>
            <text x="110" y="24" class="field-val">Jain College of Engineering, Belagavi</text>
            
            <text x="0" y="48" class="field-key">LEADERSHIP // </text>
            <text x="108" y="48" class="field-val" fill="#38bdf8">Vice President <tspan class="field-val-sub">— Department of Artificial Intelligence &amp; Machine Learning</tspan></text>
        </g>

        <!-- Row 3: Engineering Systems DNA -->
        <g transform="translate(0, 132)">
            <text x="0" y="0" class="field-key">PIPELINE // </text>
            <text x="90" y="0" class="field-val" fill="#a5f3fc">Problem → Architecture → Model → API Gateway → Vector Fabric → Telemetry → Deploy</text>
            
            <text x="0" y="22" class="field-key">CORE STACK // </text>
            <text x="98" y="22" class="field-val-sub">Python 3.12 • FastAPI • PostgreSQL 16 (pgvector) • Redis • FastMCP • Docker • Three.js</text>
        </g>

        <!-- Row 4: Engineering Philosophy Box -->
        <g transform="translate(0, 184)">
            <rect x="0" y="0" width="670" height="48" rx="8" fill="#0b1329" stroke="url(#quoteBar)" stroke-width="1.5"/>
            <path d="M 8,8 L 8,40" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
            <text x="24" y="22" class="quote-text">"Don't build AI that only produces answers.</text>
            <text x="24" y="38" class="quote-text"> Build AI systems that solve real problems — measurably, reliably, and at scale."</text>
        </g>

    </g>

    <!-- Bottom Telemetry Running Bar -->
    <g transform="translate(36, 332)">
        <text x="0" y="0" class="field-key">RUNTIME_STATUS:</text>
        <rect x="125" y="-9" width="380" height="10" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <rect x="127" y="-7" width="376" height="6" rx="3" fill="#00ff88">
            <animate attributeName="width" values="100;376;340;376" dur="6s" repeatCount="indefinite"/>
        </rect>
        <text x="520" y="0" class="status-text">100% HEALTHY • 0 UNCAUGHT EXCEPTIONS</text>
        <text x="800" y="0" class="hex-spec">UPTIME: 99.98% // VER: PROD-2026</text>
    </g>

</svg>
