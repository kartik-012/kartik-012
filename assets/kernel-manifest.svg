<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="manifest-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="m-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e2e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1420" stop-opacity="0.4"/>
    </linearGradient>

    <style>
      .sans-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .mono-font {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="200" rx="14" fill="url(#manifest-bg)"/>
  <rect x="1" y="1" width="1198" height="198" rx="13" fill="none" stroke="url(#m-border)" stroke-width="1.2"/>

  <!-- Top Header Bar -->
  <rect width="1200" height="38" rx="14" fill="#111827" fill-opacity="0.8"/>
  <rect y="26" width="1200" height="12" fill="#111827" fill-opacity="0.8"/>
  <line x1="0" y1="38" x2="1200" y2="38" stroke="#1f2937" stroke-width="1"/>

  <g transform="translate(32, 24)">
    <circle cx="0" cy="0" r="4" fill="#00ff88"/>
    <text x="14" y="4" class="mono-font" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1.5">KERNEL MANIFEST // SYSTEM SPECIFICATIONS</text>
  </g>

  <g transform="translate(1030, 24)">
    <rect x="0" y="-12" width="138" height="22" rx="11" fill="#065f46" fill-opacity="0.4" stroke="#059669" stroke-width="0.8"/>
    <circle cx="14" cy="-1" r="3" fill="#34d399"/>
    <text x="24" y="3" class="mono-font" font-size="10" font-weight="700" fill="#34d399">STATUS: ACTIVE</text>
  </g>

  <!-- 3 Main Columns / Panels -->
  <!-- COLUMN 1: IDENTITY -->
  <g transform="translate(32, 54)">
    <rect width="350" height="130" rx="10" fill="url(#panel-bg)" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" class="mono-font" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.5">OPERATOR IDENTITY</text>
    <text x="20" y="56" class="sans-font" font-size="22" font-weight="900" fill="#ffffff">Kartik Raikar</text>
    <text x="20" y="78" class="sans-font" font-size="13" font-weight="700" fill="#38bdf8">AI Systems &amp; Backend Engineer</text>
    <g transform="translate(20, 96)">
      <rect width="112" height="20" rx="4" fill="#1e293b"/>
      <text x="10" y="14" class="mono-font" font-size="10" fill="#94a3b8">📍 Belagavi, IN</text>
      <rect x="120" y="0" width="130" height="20" rx="4" fill="#1e293b"/>
      <text x="130" y="14" class="mono-font" font-size="10" fill="#34d399">⚡ Final Year B.E.</text>
    </g>
  </g>

  <!-- COLUMN 2: TECH STACK FABRIC -->
  <g transform="translate(402, 54)">
    <rect width="410" height="130" rx="10" fill="url(#panel-bg)" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" class="mono-font" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.5">DISTRIBUTED &amp; AI RUNTIME</text>

    <!-- Row 1 -->
    <g transform="translate(20, 44)">
      <rect width="68" height="22" rx="4" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="34" y="15" class="mono-font" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Python</text>

      <rect x="76" y="0" width="75" height="22" rx="4" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="113" y="15" class="mono-font" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">FastAPI</text>

      <rect x="159" y="0" width="102" height="22" rx="4" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="210" y="15" class="mono-font" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">Kafka KRaft</text>

      <rect x="269" y="0" width="88" height="22" rx="4" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="313" y="15" class="mono-font" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">gRPC HTTP/2</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 74)">
      <rect width="90" height="22" rx="4" fill="#1e293b"/>
      <text x="45" y="15" class="mono-font" font-size="11" fill="#e2e8f0" text-anchor="middle">PostgreSQL</text>

      <rect x="98" y="0" width="76" height="22" rx="4" fill="#1e293b"/>
      <text x="136" y="15" class="mono-font" font-size="11" fill="#e2e8f0" text-anchor="middle">pgvector</text>

      <rect x="182" y="0" width="62" height="22" rx="4" fill="#1e293b"/>
      <text x="213" y="15" class="mono-font" font-size="11" fill="#e2e8f0" text-anchor="middle">Redis</text>

      <rect x="252" y="0" width="66" height="22" rx="4" fill="#1e293b"/>
      <text x="285" y="15" class="mono-font" font-size="11" fill="#e2e8f0" text-anchor="middle">Docker</text>

      <rect x="326" y="0" width="58" height="22" rx="4" fill="#1e293b"/>
      <text x="355" y="15" class="mono-font" font-size="11" fill="#e2e8f0" text-anchor="middle">RAG</text>
    </g>

    <text x="20" y="118" class="mono-font" font-size="10" fill="#64748b">ARCHITECTURE: Clean Architecture • Event-Driven • Saga Pattern</text>
  </g>

  <!-- COLUMN 3: CREDENTIALS & LEADERSHIP -->
  <g transform="translate(832, 54)">
    <rect width="336" height="130" rx="10" fill="url(#panel-bg)" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" class="mono-font" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.5">CREDENTIALS &amp; ROLES</text>

    <g transform="translate(20, 42)">
      <text x="0" y="14" class="sans-font" font-size="12" font-weight="700" fill="#ffffff">🏆 Oracle Cloud AI Certified</text>
      <text x="0" y="34" class="sans-font" font-size="12" font-weight="700" fill="#ffffff">🏆 AWS Machine Learning Certified</text>
      <text x="0" y="54" class="sans-font" font-size="12" font-weight="700" fill="#34d399">👥 Vice President — AI &amp; ML Dept (300+)</text>
      <text x="0" y="74" class="sans-font" font-size="11" font-weight="500" fill="#94a3b8">🎓 B.E. Computer Science (AI &amp; ML)</text>
    </g>
  </g>
</svg>
