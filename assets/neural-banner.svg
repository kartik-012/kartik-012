<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Master Color Palettes & Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="emerald-glow" cx="20%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#00ff88" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyan-glow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-glow" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2fdf4"/>
      <stop offset="70%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <!-- Badge Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e2e" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0d1420" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Laser Stream Gradient -->
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00ff88" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="text-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseBeacon {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.4); opacity: 0.3; }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: -1200; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes gridPulse {
        0%, 100% { opacity: 0.04; }
        50% { opacity: 0.08; }
      }
      .beacon-ring {
        transform-origin: 1042px 36px;
        animation: pulseBeacon 2.4s ease-in-out infinite;
      }
      .laser-line {
        stroke-dasharray: 240 400;
        animation: streamFlow 5s linear infinite;
      }
      .floating-group {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .grid-layer {
        animation: gridPulse 4s ease-in-out infinite;
      }
      .mono-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="360" rx="16" fill="url(#emerald-glow)"/>
  <rect width="1200" height="360" rx="16" fill="url(#cyan-glow)"/>
  <rect width="1200" height="360" rx="16" fill="url(#purple-glow)"/>

  <!-- High-Tech Cyber Perspective Grid -->
  <g class="grid-layer" stroke="#00ff88" stroke-width="0.75" fill="none">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="20" x2="1200" y2="20"/>
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="85" x2="1200" y2="85"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="185" x2="1200" y2="185"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>

    <!-- Vertical Lines -->
    <line x1="50" y1="0" x2="50" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="420" y1="0" x2="420" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="780" y1="0" x2="780" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/>
  </g>

  <!-- Left Side Geometric Node Constellation -->
  <g opacity="0.35" stroke="#00ff88" stroke-width="1" fill="none">
    <path d="M 40 180 L 100 130 L 160 170 L 220 110 L 200 200 Z"/>
    <circle cx="40" cy="180" r="3" fill="#00ff88"/>
    <circle cx="100" cy="130" r="3.5" fill="#00e5ff"/>
    <circle cx="160" cy="170" r="2.5" fill="#00ff88"/>
    <circle cx="220" cy="110" r="4" fill="#a855f7"/>
    <circle cx="200" cy="200" r="3" fill="#00e5ff"/>
  </g>

  <!-- Right Side Geometric Node Constellation -->
  <g opacity="0.35" stroke="#00e5ff" stroke-width="1" fill="none">
    <path d="M 1160 180 L 1100 130 L 1040 170 L 980 110 L 1000 200 Z"/>
    <circle cx="1160" cy="180" r="3" fill="#00e5ff"/>
    <circle cx="1100" cy="130" r="3.5" fill="#00ff88"/>
    <circle cx="1040" cy="170" r="2.5" fill="#a855f7"/>
    <circle cx="980" cy="110" r="4" fill="#00e5ff"/>
    <circle cx="1000" cy="200" r="3" fill="#00ff88"/>
  </g>

  <!-- Flowing High-Energy Beam Across Center -->
  <path class="laser-line" d="M 0 160 Q 300 120, 600 160 T 1200 160" stroke="url(#laser-grad)" stroke-width="2" fill="none"/>
  <path class="laser-line" d="M 0 205 Q 300 235, 600 205 T 1200 205" stroke="url(#laser-grad)" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- Master Border Frame with Precision Corners -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.5" opacity="0.75"/>

  <!-- High-Precision HUD Brackets -->
  <g stroke="#00ff88" stroke-width="2" fill="none" opacity="0.85">
    <!-- Top-Left -->
    <path d="M 14 36 L 14 14 L 36 14"/>
    <!-- Top-Right -->
    <path d="M 1164 14 L 1186 14 L 1186 36"/>
    <!-- Bottom-Left -->
    <path d="M 14 324 L 14 346 L 36 346"/>
    <!-- Bottom-Right -->
    <path d="M 1164 346 L 1186 346 L 1186 324"/>
  </g>

  <!-- TOP STATUS BAR DOCK -->
  <!-- Left Telemetry Pill -->
  <g transform="translate(46, 24)">
    <rect width="260" height="26" rx="13" fill="#111827" fill-opacity="0.8" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.35"/>
    <circle cx="16" cy="13" r="3.5" fill="#00ff88"/>
    <text x="30" y="17" class="mono-text" font-size="11" font-weight="600" fill="#a7f3d0" letter-spacing="1">SYS::NEURAL_ENGINE v3.2</text>
  </g>

  <!-- Center Latency Indicator -->
  <g transform="translate(485, 24)">
    <rect width="230" height="26" rx="13" fill="#111827" fill-opacity="0.8" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="115" y="17" class="mono-text" font-size="11" font-weight="600" fill="#67e8f9" text-anchor="middle" letter-spacing="1.2">⚡ MTTR CORRELATION: 780ms</text>
  </g>

  <!-- Right Online Status Pill -->
  <g transform="translate(895, 24)">
    <rect width="258" height="26" rx="13" fill="#111827" fill-opacity="0.8" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.4"/>
    <circle class="beacon-ring" cx="18" cy="13" r="6" fill="#00ff88" opacity="0.4"/>
    <circle cx="18" cy="13" r="3.5" fill="#00ff88"/>
    <text x="32" y="17" class="mono-text" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1.2">FINAL YEAR • B.E. AI &amp; ML</text>
  </g>

  <!-- ================= MAIN IDENTITY SECTION ================= -->
  <g class="floating-group" transform="translate(600, 142)">
    <!-- Ambient Behind-Title Glow -->
    <ellipse cx="0" cy="-6" rx="360" ry="45" fill="#00ff88" opacity="0.12" filter="url(#text-glow)"/>
    <ellipse cx="0" cy="-6" rx="280" ry="35" fill="#00e5ff" opacity="0.1" filter="url(#text-glow)"/>

    <!-- Core Name Title -->
    <text x="0" y="0" class="sans-text" font-size="56" font-weight="900" fill="url(#title-grad)" text-anchor="middle" letter-spacing="6">
      KARTIK RAIKAR
    </text>

    <!-- Professional Role Title -->
    <text x="0" y="32" class="sans-text" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="4">
      AI SYSTEMS ENGINEER  <tspan fill="#00ff88">•</tspan>  DISTRIBUTED BACKEND ARCHITECT
    </text>

    <!-- Sub-headline Tech Highlights -->
    <text x="0" y="55" class="mono-text" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">
      Python <tspan fill="#334155">|</tspan> FastAPI <tspan fill="#334155">|</tspan> Kafka KRaft <tspan fill="#334155">|</tspan> gRPC HTTP/2 <tspan fill="#334155">|</tspan> pgvector <tspan fill="#334155">|</tspan> Redis <tspan fill="#334155">|</tspan> Docker <tspan fill="#334155">|</tspan> Agentic AI
    </text>
  </g>

  <!-- ================= BOTTOM GLASSMORPHIC METRIC DOCK (4 CARDS) ================= -->
  <g transform="translate(50, 260)">
    <!-- Card 1: Incident Engine -->
    <g transform="translate(0, 0)">
      <rect width="258" height="66" rx="10" fill="url(#card-grad)" stroke="#00ff88" stroke-width="1" stroke-opacity="0.35"/>
      <rect x="0" y="0" width="4" height="66" rx="2" fill="#00ff88"/>
      <text x="20" y="24" class="sans-text" font-size="14" font-weight="800" fill="#ffffff">AIOps Incident Engine</text>
      <text x="20" y="42" class="mono-text" font-size="12" font-weight="700" fill="#00ff88">0.78s MTTR <tspan fill="#94a3b8" font-weight="400">| 100% Top-1 RCA</tspan></text>
      <text x="20" y="56" class="sans-text" font-size="10" font-weight="500" fill="#64748b">30 Cascading Failure Benchmarks</text>
    </g>

    <!-- Card 2: Precision Retrieval -->
    <g transform="translate(280, 0)">
      <rect width="258" height="66" rx="10" fill="url(#card-grad)" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.35"/>
      <rect x="0" y="0" width="4" height="66" rx="2" fill="#00e5ff"/>
      <text x="20" y="24" class="sans-text" font-size="14" font-weight="800" fill="#ffffff">VersionRAG System</text>
      <text x="20" y="42" class="mono-text" font-size="12" font-weight="700" fill="#00e5ff">98.4% Precision <tspan fill="#94a3b8" font-weight="400">| 0.0% Halluc.</tspan></text>
      <text x="20" y="56" class="sans-text" font-size="10" font-weight="500" fill="#64748b">AST Code-Aware Vector Sharding</text>
    </g>

    <!-- Card 3: MCP Protocol -->
    <g transform="translate(560, 0)">
      <rect width="258" height="66" rx="10" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.35"/>
      <rect x="0" y="0" width="4" height="66" rx="2" fill="#a855f7"/>
      <text x="20" y="24" class="sans-text" font-size="14" font-weight="800" fill="#ffffff">Model Context Protocol</text>
      <text x="20" y="42" class="mono-text" font-size="12" font-weight="700" fill="#c084fc">Saga Engine <tspan fill="#94a3b8" font-weight="400">| 20/20 Stress Tests</tspan></text>
      <text x="20" y="56" class="sans-text" font-size="10" font-weight="500" fill="#64748b">Fault-Tolerant Autonomous Tools</text>
    </g>

    <!-- Card 4: Event & Data Fabric -->
    <g transform="translate(840, 0)">
      <rect width="258" height="66" rx="10" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.35"/>
      <rect x="0" y="0" width="4" height="66" rx="2" fill="#f59e0b"/>
      <text x="20" y="24" class="sans-text" font-size="14" font-weight="800" fill="#ffffff">Data &amp; Event Fabric</text>
      <text x="20" y="42" class="mono-text" font-size="12" font-weight="700" fill="#fbbf24">Kafka KRaft <tspan fill="#94a3b8" font-weight="400">+ pgvector</tspan></text>
      <text x="20" y="56" class="sans-text" font-size="10" font-weight="500" fill="#64748b">7 Topics · gRPC HTTP/2 Streaming</text>
    </g>
  </g>

</svg>
