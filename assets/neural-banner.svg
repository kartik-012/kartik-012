<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.4; r: 4; }
        50% { opacity: 1; r: 7; }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 4px #00ff88); opacity: 0.5; }
        50% { filter: drop-shadow(0 0 12px #00ff88); opacity: 1; }
      }
      @keyframes glitch {
        0% { transform: translate(0,0); }
        2% { transform: translate(-3px, 1px); }
        4% { transform: translate(3px, -1px); }
        6% { transform: translate(0,0); }
        94% { transform: translate(0,0); }
        96% { transform: translate(2px, 2px); }
        98% { transform: translate(-2px, -1px); }
        100% { transform: translate(0,0); }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 200; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes subtitleFade {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .node { animation: pulse 2s ease-in-out infinite; fill: #00ff88; }
      .line { stroke: #00ff88; stroke-width: 1; fill: none; stroke-dasharray: 200; animation: flowLine 3s linear infinite; }
      .title { animation: glitch 6s steps(1) infinite; }
      .subtitle { animation: subtitleFade 4s ease-in-out infinite; }
    </style>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strong-glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="#0d1117"/>
  <!-- Subtle grid -->
  <g stroke="#00ff88" stroke-width="0.2" opacity="0.08">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="60" y1="0" x2="60" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="280"/>
    <line x1="180" y1="0" x2="180" y2="280"/>
    <line x1="240" y1="0" x2="240" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="960" y1="0" x2="960" y2="280"/>
    <line x1="1020" y1="0" x2="1020" y2="280"/>
    <line x1="1080" y1="0" x2="1080" y2="280"/>
    <line x1="1140" y1="0" x2="1140" y2="280"/>
  </g>

  <!-- Neural network lines LEFT -->
  <line class="line" x1="60" y1="30" x2="150" y2="80" style="animation-delay:0s"/>
  <line class="line" x1="60" y1="30" x2="130" y2="150" style="animation-delay:0.3s"/>
  <line class="line" x1="150" y1="80" x2="260" y2="50" style="animation-delay:0.6s"/>
  <line class="line" x1="150" y1="80" x2="250" y2="140" style="animation-delay:0.9s"/>
  <line class="line" x1="130" y1="150" x2="250" y2="140" style="animation-delay:0.4s"/>
  <line class="line" x1="130" y1="150" x2="200" y2="230" style="animation-delay:0.7s"/>
  <line class="line" x1="60" y1="220" x2="130" y2="150" style="animation-delay:1.0s"/>
  <line class="line" x1="60" y1="220" x2="200" y2="230" style="animation-delay:1.2s"/>
  <line class="line" x1="260" y1="50" x2="320" y2="90" style="animation-delay:0.2s"/>
  <line class="line" x1="250" y1="140" x2="320" y2="90" style="animation-delay:0.5s"/>
  <line class="line" x1="250" y1="140" x2="310" y2="200" style="animation-delay:0.8s"/>
  <line class="line" x1="200" y1="230" x2="310" y2="200" style="animation-delay:1.1s"/>

  <!-- Neural network lines RIGHT -->
  <line class="line" x1="1140" y1="30" x2="1050" y2="80" style="animation-delay:0.1s"/>
  <line class="line" x1="1140" y1="30" x2="1070" y2="150" style="animation-delay:0.4s"/>
  <line class="line" x1="1050" y1="80" x2="940" y2="50" style="animation-delay:0.7s"/>
  <line class="line" x1="1050" y1="80" x2="950" y2="140" style="animation-delay:1.0s"/>
  <line class="line" x1="1070" y1="150" x2="950" y2="140" style="animation-delay:0.5s"/>
  <line class="line" x1="1070" y1="150" x2="1000" y2="230" style="animation-delay:0.8s"/>
  <line class="line" x1="1140" y1="220" x2="1070" y2="150" style="animation-delay:1.1s"/>
  <line class="line" x1="1140" y1="220" x2="1000" y2="230" style="animation-delay:1.3s"/>
  <line class="line" x1="940" y1="50" x2="880" y2="90" style="animation-delay:0.3s"/>
  <line class="line" x1="950" y1="140" x2="880" y2="90" style="animation-delay:0.6s"/>
  <line class="line" x1="950" y1="140" x2="890" y2="200" style="animation-delay:0.9s"/>
  <line class="line" x1="1000" y1="230" x2="890" y2="200" style="animation-delay:1.2s"/>

  <!-- Nodes LEFT -->
  <circle class="node" cx="60" cy="30" r="5" style="animation-delay:0s"/>
  <circle class="node" cx="150" cy="80" r="4" style="animation-delay:0.3s"/>
  <circle class="node" cx="130" cy="150" r="6" style="animation-delay:0.6s"/>
  <circle class="node" cx="60" cy="220" r="4" style="animation-delay:0.9s"/>
  <circle class="node" cx="260" cy="50" r="5" style="animation-delay:0.2s"/>
  <circle class="node" cx="250" cy="140" r="4" style="animation-delay:0.5s"/>
  <circle class="node" cx="200" cy="230" r="5" style="animation-delay:0.8s"/>
  <circle class="node" cx="320" cy="90" r="4" style="animation-delay:1.1s"/>
  <circle class="node" cx="310" cy="200" r="5" style="animation-delay:1.4s"/>

  <!-- Nodes RIGHT -->
  <circle class="node" cx="1140" cy="30" r="5" style="animation-delay:0.1s"/>
  <circle class="node" cx="1050" cy="80" r="4" style="animation-delay:0.4s"/>
  <circle class="node" cx="1070" cy="150" r="6" style="animation-delay:0.7s"/>
  <circle class="node" cx="1140" cy="220" r="4" style="animation-delay:1.0s"/>
  <circle class="node" cx="940" cy="50" r="5" style="animation-delay:0.3s"/>
  <circle class="node" cx="950" cy="140" r="4" style="animation-delay:0.6s"/>
  <circle class="node" cx="1000" cy="230" r="5" style="animation-delay:0.9s"/>
  <circle class="node" cx="880" cy="90" r="4" style="animation-delay:1.2s"/>
  <circle class="node" cx="890" cy="200" r="5" style="animation-delay:1.5s"/>

  <!-- Extra scattered nodes -->
  <circle class="node" cx="100" cy="260" r="3" style="animation-delay:0.5s"/>
  <circle class="node" cx="190" cy="20" r="3" style="animation-delay:1.0s"/>
  <circle class="node" cx="1100" cy="260" r="3" style="animation-delay:0.6s"/>
  <circle class="node" cx="1010" cy="20" r="3" style="animation-delay:1.1s"/>

  <!-- Border glow -->
  <rect width="1200" height="280" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.4" filter="url(#glow-filter)"/>

  <!-- Top line accent -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="278" x2="1200" y2="278" stroke="#00ff88" stroke-width="2" opacity="0.7"/>

  <!-- Glitch title -->
  <g class="title" filter="url(#strong-glow)">
    <text x="600" y="130" font-family="'Courier New', monospace" font-size="58" font-weight="900"
          fill="#00ff88" text-anchor="middle" letter-spacing="12">KARTIK RAIKAR</text>
    <!-- Glitch shadow -->
    <text x="603" y="130" font-family="'Courier New', monospace" font-size="58" font-weight="900"
          fill="#f43f5e" text-anchor="middle" letter-spacing="12" opacity="0.3">KARTIK RAIKAR</text>
    <text x="597" y="130" font-family="'Courier New', monospace" font-size="58" font-weight="900"
          fill="#06b6d4" text-anchor="middle" letter-spacing="12" opacity="0.2">KARTIK RAIKAR</text>
  </g>

  <!-- Subtitle -->
  <text class="subtitle" x="600" y="175" font-family="'Courier New', monospace" font-size="18"
        fill="#a855f7" text-anchor="middle" letter-spacing="4">AI Systems Engineer · Distributed Backend · GenAI</text>

  <!-- Corner brackets -->
  <g stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 20 20 L 20 5 L 35 5"/>
    <path d="M 1180 20 L 1180 5 L 1165 5"/>
    <path d="M 20 260 L 20 275 L 35 275"/>
    <path d="M 1180 260 L 1180 275 L 1165 275"/>
  </g>

  <!-- ID tag -->
  <text x="30" y="265" font-family="monospace" font-size="10" fill="#00ff88" opacity="0.5">SYS::KARTIK-012</text>
  <text x="1170" y="265" font-family="monospace" font-size="10" fill="#00ff88" opacity="0.5" text-anchor="end">v2.0.0</text>
</svg>
