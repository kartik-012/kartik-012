<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <linearGradient id="sm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>

    <linearGradient id="bar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <linearGradient id="bar-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="bar-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <style>
      .sans-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .mono-font {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
      @keyframes barGrow1 { 0% { width: 0; } 100% { width: 440px; } }
      @keyframes barGrow2 { 0% { width: 0; } 100% { width: 440px; } }
      @keyframes barGrow3 { 0% { width: 0; } 100% { width: 432px; } }
      @keyframes barGrow4 { 0% { width: 0; } 100% { width: 414px; } }
      @keyframes barGrow5 { 0% { width: 0; } 100% { width: 440px; } }
      @keyframes barGrow6 { 0% { width: 0; } 100% { width: 440px; } }
      .bg1 { animation: barGrow1 1.8s ease-out forwards; }
      .bg2 { animation: barGrow2 2.0s ease-out forwards; }
      .bg3 { animation: barGrow3 2.2s ease-out forwards; }
      .bg4 { animation: barGrow4 2.4s ease-out forwards; }
      .bg5 { animation: barGrow5 2.6s ease-out forwards; }
      .bg6 { animation: barGrow6 2.8s ease-out forwards; }
    </style>
  </defs>

  <rect width="1200" height="240" rx="14" fill="url(#sm-bg)"/>
  <rect x="1" y="1" width="1198" height="238" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top Header Bar -->
  <rect width="1200" height="40" rx="14" fill="#111827" fill-opacity="0.8"/>
  <rect y="28" width="1200" height="12" fill="#111827" fill-opacity="0.8"/>
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#1f2937" stroke-width="1"/>

  <g transform="translate(32, 25)">
    <circle cx="0" cy="0" r="4" fill="#00ff88"/>
    <text x="14" y="4" class="mono-font" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1.5">TELEMETRY BENCHMARKS // EMPIRICAL PRODUCTION METRICS</text>
  </g>

  <!-- Left Column (3 Metrics) -->
  <g transform="translate(40, 68)">
    <!-- Metric 1: MTTR -->
    <text x="0" y="14" class="sans-font" font-size="13" font-weight="700" fill="#ffffff">Incident Correlation MTTR</text>
    <text x="260" y="14" class="mono-font" font-size="13" font-weight="800" fill="#00ff88">0.78s (Sub-Second)</text>
    <rect x="0" y="24" width="440" height="10" rx="5" fill="#1e293b"/>
    <rect class="bg1" x="0" y="24" height="10" rx="5" fill="url(#bar-green)"/>

    <!-- Metric 2: Top-1 RCA -->
    <text x="0" y="68" class="sans-font" font-size="13" font-weight="700" fill="#ffffff">Root Cause Analysis Accuracy</text>
    <text x="260" y="68" class="mono-font" font-size="13" font-weight="800" fill="#00e5ff">100% Top-1 Precision</text>
    <rect x="0" y="78" width="440" height="10" rx="5" fill="#1e293b"/>
    <rect class="bg2" x="0" y="78" height="10" rx="5" fill="url(#bar-cyan)"/>

    <!-- Metric 3: Vector Precision -->
    <text x="0" y="122" class="sans-font" font-size="13" font-weight="700" fill="#ffffff">Code-Aware Vector Precision</text>
    <text x="260" y="122" class="mono-font" font-size="13" font-weight="800" fill="#c084fc">98.4% (AST Diffing)</text>
    <rect x="0" y="132" width="440" height="10" rx="5" fill="#1e293b"/>
    <rect class="bg3" x="0" y="132" height="10" rx="5" fill="url(#bar-purple)"/>
  </g>

  <!-- Divider -->
  <line x1="600" y1="55" x2="600" y2="225" stroke="#1e293b" stroke-width="1"/>

  <!-- Right Column (3 Metrics) -->
  <g transform="translate(640, 68)">
    <!-- Metric 4: Redis Hit Rate -->
    <text x="0" y="14" class="sans-font" font-size="13" font-weight="700" fill="#ffffff">Redis Cache Hit Rate</text>
    <text x="260" y="14" class="mono-font" font-size="13" font-weight="800" fill="#fbbf24">94.2% Hit Ratio</text>
    <rect x="0" y="24" width="440" height="10" rx="5" fill="#1e293b"/>
    <rect class="bg4" x="0" y="24" height="10" rx="5" fill="url(#bar-amber)"/>

    <!-- Metric 5: MCP Tool Intent -->
    <text x="0" y="68" class="sans-font" font-size="13" font-weight="700" fill="#ffffff">MCP Tool Intent Classification</text>
    <text x="260" y="68" class="mono-font" font-size="13" font-weight="800" fill="#00ff88">100% (20/20 Stress)</text>
    <rect x="0" y="78" width="440" height="10" rx="5" fill="#1e293b"/>
    <rect class="bg5" x="0" y="78" height="10" rx="5" fill="url(#bar-green)"/>

    <!-- Metric 6: Zero Hallucination -->
    <text x="0" y="122" class="sans-font" font-size="13" font-weight="700" fill="#ffffff">Hallucination Mitigation Rate</text>
    <text x="260" y="122" class="mono-font" font-size="13" font-weight="800" fill="#00e5ff">0.0% Hallucinations</text>
    <rect x="0" y="132" width="440" height="10" rx="5" fill="#1e293b"/>
    <rect class="bg6" x="0" y="132" height="10" rx="5" fill="url(#bar-cyan)"/>
  </g>
</svg>
