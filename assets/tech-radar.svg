<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <style>
      @keyframes sweep {
        from { transform: rotate(0deg); transform-origin: 450px 300px; }
        to   { transform: rotate(360deg); transform-origin: 450px 300px; }
      }
      @keyframes dotPulse {
        0%,100% { r:5; opacity:0.7; }
        50% { r:8; opacity:1; }
      }
      @keyframes outerRing {
        0%,100% { opacity:0.3 } 50% { opacity:0.6 }
      }
    </style>
    <filter id="radarGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="600" fill="#0d1117" rx="10"/>
  <rect x="2" y="2" width="896" height="596" rx="9" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>

  <!-- Title -->
  <text x="450" y="30" font-family="'Courier New', monospace" font-size="13" fill="#8b949e" text-anchor="middle" letter-spacing="4">TECHNOLOGY RADAR</text>
  <line x1="50" y1="38" x2="850" y2="38" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>

  <!-- Concentric circles -->
  <g stroke="#00ff88" fill="none" opacity="0.2">
    <circle cx="450" cy="310" r="80"/>
    <circle cx="450" cy="310" r="160"/>
    <circle cx="450" cy="310" r="240"/>
  </g>

  <!-- Cross lines -->
  <line x1="450" y1="50" x2="450" y2="570" stroke="#00ff88" stroke-width="0.5" opacity="0.15"/>
  <line x1="90" y1="310" x2="810" y2="310" stroke="#00ff88" stroke-width="0.5" opacity="0.15"/>
  <line x1="167" y1="87" x2="733" y2="533" stroke="#00ff88" stroke-width="0.5" opacity="0.08"/>
  <line x1="733" y1="87" x2="167" y2="533" stroke="#00ff88" stroke-width="0.5" opacity="0.08"/>

  <!-- Animated sweep line (sector) -->
  <g style="animation: sweep 6s linear infinite; transform-origin: 450px 310px;">
    <path d="M 450 310 L 450 70 A 240 240 0 0 1 657 143 Z" fill="#00ff88" opacity="0.08"/>
    <line x1="450" y1="310" x2="450" y2="70" stroke="#00ff88" stroke-width="2" opacity="0.7" filter="url(#radarGlow)"/>
  </g>

  <!-- Ring labels -->
  <text x="455" y="240" font-family="'Courier New', monospace" font-size="9" fill="#00ff88" opacity="0.5">CORE</text>
  <text x="455" y="162" font-family="'Courier New', monospace" font-size="9" fill="#06b6d4" opacity="0.5">INFRA</text>
  <text x="455" y="80" font-family="'Courier New', monospace" font-size="9" fill="#a855f7" opacity="0.5">EMERGING</text>

  <!-- CENTER RING DOTS — Python, FastAPI, Kafka, gRPC -->
  <!-- Python at 0deg -->
  <circle cx="450" cy="235" r="6" fill="#00ff88" style="animation: dotPulse 2s ease-in-out infinite; animation-delay:0s;" filter="url(#radarGlow)"/>
  <text x="458" y="228" font-family="'Courier New', monospace" font-size="11" fill="#00ff88">Python</text>

  <!-- FastAPI at 90deg -->
  <circle cx="525" cy="310" r="6" fill="#00ff88" style="animation: dotPulse 2s ease-in-out infinite; animation-delay:0.5s;" filter="url(#radarGlow)"/>
  <text x="530" y="314" font-family="'Courier New', monospace" font-size="11" fill="#00ff88">FastAPI</text>

  <!-- Kafka at 180deg -->
  <circle cx="450" cy="385" r="6" fill="#00ff88" style="animation: dotPulse 2s ease-in-out infinite; animation-delay:1s;" filter="url(#radarGlow)"/>
  <text x="410" y="400" font-family="'Courier New', monospace" font-size="11" fill="#00ff88">Kafka</text>

  <!-- gRPC at 270deg -->
  <circle cx="375" cy="310" r="6" fill="#00ff88" style="animation: dotPulse 2s ease-in-out infinite; animation-delay:1.5s;" filter="url(#radarGlow)"/>
  <text x="290" y="314" font-family="'Courier New', monospace" font-size="11" fill="#00ff88">gRPC</text>

  <!-- MIDDLE RING DOTS — PostgreSQL, Redis, Docker, Kubernetes -->
  <!-- PostgreSQL ~45deg from center ring -->
  <circle cx="563" cy="197" r="6" fill="#06b6d4" style="animation: dotPulse 2.2s ease-in-out infinite; animation-delay:0.2s;" filter="url(#radarGlow)"/>
  <text x="570" y="193" font-family="'Courier New', monospace" font-size="11" fill="#06b6d4">PostgreSQL</text>

  <!-- Redis ~135deg -->
  <circle cx="563" cy="423" r="6" fill="#06b6d4" style="animation: dotPulse 2.2s ease-in-out infinite; animation-delay:0.7s;" filter="url(#radarGlow)"/>
  <text x="540" y="443" font-family="'Courier New', monospace" font-size="11" fill="#06b6d4">Redis</text>

  <!-- Docker ~225deg -->
  <circle cx="337" cy="423" r="6" fill="#06b6d4" style="animation: dotPulse 2.2s ease-in-out infinite; animation-delay:1.2s;" filter="url(#radarGlow)"/>
  <text x="260" y="443" font-family="'Courier New', monospace" font-size="11" fill="#06b6d4">Docker</text>

  <!-- Kubernetes ~315deg -->
  <circle cx="337" cy="197" r="6" fill="#06b6d4" style="animation: dotPulse 2.2s ease-in-out infinite; animation-delay:1.7s;" filter="url(#radarGlow)"/>
  <text x="240" y="193" font-family="'Courier New', monospace" font-size="11" fill="#06b6d4">Kubernetes</text>

  <!-- OUTER RING DOTS — React, Next.js, Three.js, TensorFlow -->
  <!-- React ~22.5deg -->
  <circle cx="542" cy="127" r="6" fill="#a855f7" style="animation: dotPulse 2.4s ease-in-out infinite; animation-delay:0.3s;" filter="url(#radarGlow)"/>
  <text x="550" y="123" font-family="'Courier New', monospace" font-size="11" fill="#a855f7">React</text>

  <!-- Next.js ~112.5deg -->
  <circle cx="636" cy="423" r="6" fill="#a855f7" style="animation: dotPulse 2.4s ease-in-out infinite; animation-delay:0.8s;" filter="url(#radarGlow)"/>
  <text x="618" y="443" font-family="'Courier New', monospace" font-size="11" fill="#a855f7">Next.js</text>

  <!-- Three.js ~202.5deg -->
  <circle cx="358" cy="493" r="6" fill="#a855f7" style="animation: dotPulse 2.4s ease-in-out infinite; animation-delay:1.3s;" filter="url(#radarGlow)"/>
  <text x="305" y="513" font-family="'Courier New', monospace" font-size="11" fill="#a855f7">Three.js</text>

  <!-- TensorFlow ~292.5deg -->
  <circle cx="264" cy="197" r="6" fill="#a855f7" style="animation: dotPulse 2.4s ease-in-out infinite; animation-delay:1.8s;" filter="url(#radarGlow)"/>
  <text x="160" y="193" font-family="'Courier New', monospace" font-size="11" fill="#a855f7">TensorFlow</text>

  <!-- Extra outer dots -->
  <circle cx="450" cy="72" r="5" fill="#f59e0b" style="animation: dotPulse 2.6s ease-in-out infinite; animation-delay:0.4s;"/>
  <text x="458" y="68" font-family="'Courier New', monospace" font-size="10" fill="#f59e0b">pgvector</text>
  <circle cx="690" cy="310" r="5" fill="#f59e0b" style="animation: dotPulse 2.6s ease-in-out infinite; animation-delay:0.9s;"/>
  <text x="698" y="314" font-family="'Courier New', monospace" font-size="10" fill="#f59e0b">Qdrant</text>

  <!-- Center dot -->
  <circle cx="450" cy="310" r="8" fill="#00ff88" opacity="0.9" filter="url(#radarGlow)"/>
  <circle cx="450" cy="310" r="4" fill="#0d1117"/>

  <!-- Legend -->
  <g font-family="'Courier New', monospace" font-size="10">
    <circle cx="70" cy="555" r="5" fill="#00ff88"/>
    <text x="82" y="559" fill="#00ff88">Core Stack</text>
    <circle cx="180" cy="555" r="5" fill="#06b6d4"/>
    <text x="192" y="559" fill="#06b6d4">Infrastructure</text>
    <circle cx="310" cy="555" r="5" fill="#a855f7"/>
    <text x="322" y="559" fill="#a855f7">Emerging Tech</text>
    <circle cx="450" cy="555" r="5" fill="#f59e0b"/>
    <text x="462" y="559" fill="#f59e0b">Data / Vector</text>
  </g>
</svg>
