<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="tr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <radialGradient id="radar-glow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .sans-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .mono-font {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes blipPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      .sweep-group {
        transform-origin: 450px 310px;
        animation: radarSweep 6s linear infinite;
      }
      .blip {
        animation: blipPulse 2.5s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>
  </defs>

  <rect width="900" height="600" rx="14" fill="url(#tr-bg)"/>
  <rect width="900" height="600" rx="14" fill="url(#radar-glow)"/>
  <rect x="1" y="1" width="898" height="598" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Header -->
  <rect width="900" height="42" rx="14" fill="#111827" fill-opacity="0.8"/>
  <rect y="30" width="900" height="12" fill="#111827" fill-opacity="0.8"/>
  <line x1="0" y1="42" x2="900" y2="42" stroke="#1f2937" stroke-width="1"/>

  <g transform="translate(32, 26)">
    <circle cx="0" cy="0" r="4" fill="#00ff88"/>
    <text x="14" y="4" class="mono-font" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1.5">RADAR // TECHNICAL PROFICIENCY &amp; SPECIALIZATIONS</text>
  </g>

  <!-- Concentric Rings -->
  <g stroke="#00ff88" fill="none" opacity="0.25">
    <circle cx="450" cy="310" r="80" stroke-width="1"/>
    <circle cx="450" cy="310" r="160" stroke-width="1"/>
    <circle cx="450" cy="310" r="240" stroke-width="1"/>
  </g>

  <!-- Crosshairs -->
  <line x1="450" y1="65" x2="450" y2="555" stroke="#00ff88" stroke-width="0.7" opacity="0.15"/>
  <line x1="205" y1="310" x2="695" y2="310" stroke="#00ff88" stroke-width="0.7" opacity="0.15"/>

  <!-- Rotating Sweep Beam -->
  <g class="sweep-group">
    <path d="M 450 310 L 450 70 A 240 240 0 0 1 620 140 Z" fill="#00ff88" fill-opacity="0.08"/>
    <line x1="450" y1="310" x2="450" y2="70" stroke="#00ff88" stroke-width="2" opacity="0.8" filter="url(#glow)"/>
  </g>

  <!-- Ring Tier Labels -->
  <text x="455" y="240" class="mono-font" font-size="10" font-weight="700" fill="#00ff88" opacity="0.7">CORE SYSTEMS</text>
  <text x="455" y="160" class="mono-font" font-size="10" font-weight="700" fill="#00e5ff" opacity="0.7">DISTRIBUTED INFRA</text>
  <text x="455" y="82" class="mono-font" font-size="10" font-weight="700" fill="#c084fc" opacity="0.7">AI &amp; AGENTIC OPS</text>

  <!-- CORE TIER BLIPS (Inner Ring r < 80) -->
  <g class="blip" filter="url(#glow)">
    <circle cx="450" cy="250" r="5" fill="#00ff88"/>
    <circle cx="490" cy="310" r="5" fill="#00ff88"/>
    <circle cx="410" cy="330" r="5" fill="#00ff88"/>
    <circle cx="450" cy="365" r="5" fill="#00ff88"/>
  </g>
  <text x="458" y="248" class="mono-font" font-size="11" font-weight="700" fill="#ffffff">Python</text>
  <text x="500" y="314" class="mono-font" font-size="11" font-weight="700" fill="#ffffff">FastAPI</text>
  <text x="350" y="334" class="mono-font" font-size="11" font-weight="700" fill="#ffffff">Kafka KRaft</text>
  <text x="458" y="375" class="mono-font" font-size="11" font-weight="700" fill="#ffffff">gRPC HTTP/2</text>

  <!-- INFRA TIER BLIPS (Middle Ring 80 < r < 160) -->
  <g class="blip" filter="url(#glow)">
    <circle cx="340" cy="220" r="4.5" fill="#00e5ff"/>
    <circle cx="560" cy="220" r="4.5" fill="#00e5ff"/>
    <circle cx="580" cy="360" r="4.5" fill="#00e5ff"/>
    <circle cx="320" cy="380" r="4.5" fill="#00e5ff"/>
  </g>
  <text x="250" y="215" class="mono-font" font-size="11" font-weight="600" fill="#67e8f9">PostgreSQL</text>
  <text x="572" y="215" class="mono-font" font-size="11" font-weight="600" fill="#67e8f9">pgvector</text>
  <text x="592" y="364" class="mono-font" font-size="11" font-weight="600" fill="#67e8f9">Redis Sentinel</text>
  <text x="260" y="384" class="mono-font" font-size="11" font-weight="600" fill="#67e8f9">Docker / CI/CD</text>

  <!-- AI & AGENTS TIER BLIPS (Outer Ring 160 < r < 240) -->
  <g class="blip" filter="url(#glow)">
    <circle cx="270" cy="140" r="4" fill="#a855f7"/>
    <circle cx="630" cy="140" r="4" fill="#a855f7"/>
    <circle cx="660" cy="460" r="4" fill="#a855f7"/>
    <circle cx="240" cy="460" r="4" fill="#a855f7"/>
  </g>
  <text x="180" y="135" class="mono-font" font-size="11" font-weight="600" fill="#c084fc">MCP Tool Spec</text>
  <text x="642" y="135" class="mono-font" font-size="11" font-weight="600" fill="#c084fc">VersionRAG</text>
  <text x="672" y="464" class="mono-font" font-size="11" font-weight="600" fill="#c084fc">NetworkX DAG</text>
  <text x="160" y="464" class="mono-font" font-size="11" font-weight="600" fill="#c084fc">Prometheus / SLO</text>
</svg>
