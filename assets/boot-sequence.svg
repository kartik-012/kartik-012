<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </linearGradient>

    <style>
      @keyframes lineFade1 { 0%, 5% { opacity: 0; transform: translateY(3px); } 8%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes lineFade2 { 0%, 15% { opacity: 0; transform: translateY(3px); } 18%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes lineFade3 { 0%, 25% { opacity: 0; transform: translateY(3px); } 28%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes lineFade4 { 0%, 35% { opacity: 0; transform: translateY(3px); } 38%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes lineFade5 { 0%, 45% { opacity: 0; transform: translateY(3px); } 48%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes lineFade6 { 0%, 55% { opacity: 0; transform: translateY(3px); } 58%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes lineFade7 { 0%, 65% { opacity: 0; transform: translateY(3px); } 68%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

      .term-code {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
      .l1 { animation: lineFade1 12s ease-out infinite; }
      .l2 { animation: lineFade2 12s ease-out infinite; }
      .l3 { animation: lineFade3 12s ease-out infinite; }
      .l4 { animation: lineFade4 12s ease-out infinite; }
      .l5 { animation: lineFade5 12s ease-out infinite; }
      .l6 { animation: lineFade6 12s ease-out infinite; }
      .l7 { animation: lineFade7 12s ease-out infinite; }
      .cursor-blink { animation: blinkCursor 0.9s infinite; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="900" height="380" rx="14" fill="url(#term-bg)"/>
  <rect x="1" y="1" width="898" height="378" rx="13" fill="none" stroke="url(#term-border)" stroke-width="1.2"/>

  <!-- Window Header Bar -->
  <rect width="900" height="42" rx="14" fill="#111827" fill-opacity="0.9"/>
  <rect y="32" width="900" height="10" fill="#111827" fill-opacity="0.9"/>
  <line x1="0" y1="42" x2="900" y2="42" stroke="#1f2937" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>

  <!-- Title & Session Pill -->
  <text x="450" y="26" class="term-code" font-size="12" font-weight="600" fill="#9ca3af" text-anchor="middle" letter-spacing="1">
    kartik@ai-cluster: ~/core-services (zsh)
  </text>
  <rect x="760" y="11" width="115" height="20" rx="10" fill="#1f2937" stroke="#374151" stroke-width="0.8"/>
  <text x="817" y="25" class="term-code" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">ONLINE • 2026</text>

  <!-- Terminal Content -->
  <!-- Command Invocation -->
  <g transform="translate(36, 75)" class="term-code">
    <text font-size="14" font-weight="700">
      <tspan fill="#00ff88">➜</tspan>
      <tspan fill="#38bdf8"> ~/production</tspan>
      <tspan fill="#94a3b8"> git:(</tspan><tspan fill="#f43f5e">main</tspan><tspan fill="#94a3b8">) </tspan>
      <tspan fill="#f1f5f9">python -m aiops.orchestrator --boot-live</tspan>
    </text>
  </g>

  <!-- Boot Log Outputs -->
  <g transform="translate(36, 115)" class="term-code" font-size="13">
    <!-- Line 1 -->
    <g class="l1" transform="translate(0, 0)">
      <rect width="64" height="20" rx="4" fill="#00ff88" fill-opacity="0.15"/>
      <text x="32" y="14" font-weight="700" fill="#00ff88" text-anchor="middle">INIT</text>
      <text x="76" y="15" fill="#e2e8f0">Connecting to Kafka KRaft cluster [7 topics, replication_factor=3] ... <tspan fill="#34d399" font-weight="700">CONNECTED (2.1ms)</tspan></text>
    </g>

    <!-- Line 2 -->
    <g class="l2" transform="translate(0, 30)">
      <rect width="64" height="20" rx="4" fill="#00e5ff" fill-opacity="0.15"/>
      <text x="32" y="14" font-weight="700" fill="#00e5ff" text-anchor="middle">VECTOR</text>
      <text x="76" y="15" fill="#e2e8f0">Loading pgvector embeddings (HNSW index, m=16, ef_search=64) ... <tspan fill="#38bdf8" font-weight="700">WARMED (5.4ms)</tspan></text>
    </g>

    <!-- Line 3 -->
    <g class="l3" transform="translate(0, 60)">
      <rect width="64" height="20" rx="4" fill="#a855f7" fill-opacity="0.15"/>
      <text x="32" y="14" font-weight="700" fill="#a855f7" text-anchor="middle">gRPC</text>
      <text x="76" y="15" fill="#e2e8f0">HTTP/2 multiplexed channel established with Protobuf contracts ... <tspan fill="#c084fc" font-weight="700">READY</tspan></text>
    </g>

    <!-- Line 4 -->
    <g class="l4" transform="translate(0, 90)">
      <rect width="64" height="20" rx="4" fill="#f59e0b" fill-opacity="0.15"/>
      <text x="32" y="14" font-weight="700" fill="#f59e0b" text-anchor="middle">CACHE</text>
      <text x="76" y="15" fill="#e2e8f0">Redis Sentinel distributed cache initialized [TTL=600s, HitRate=94.2%] ... <tspan fill="#fbbf24" font-weight="700">SYNCHRONIZED</tspan></text>
    </g>

    <!-- Line 5 -->
    <g class="l5" transform="translate(0, 120)">
      <rect width="64" height="20" rx="4" fill="#00ff88" fill-opacity="0.15"/>
      <text x="32" y="14" font-weight="700" fill="#00ff88" text-anchor="middle">METRICS</text>
      <text x="76" y="15" fill="#e2e8f0">Prometheus scraper mounted at /metrics · OpenTelemetry traces active ... <tspan fill="#34d399" font-weight="700">ONLINE</tspan></text>
    </g>

    <!-- Line 6 -->
    <g class="l6" transform="translate(0, 150)">
      <rect width="64" height="20" rx="4" fill="#00e5ff" fill-opacity="0.15"/>
      <text x="32" y="14" font-weight="700" fill="#00e5ff" text-anchor="middle">RCA</text>
      <text x="76" y="15" fill="#e2e8f0">AIOps causal DAG inference engine ready [Top-1 RCA: 100%, MTTR: 780ms] ... <tspan fill="#38bdf8" font-weight="700">OPTIMIZED</tspan></text>
    </g>

    <!-- Line 7: System Ready Banner -->
    <g class="l7" transform="translate(0, 184)">
      <rect width="828" height="34" rx="6" fill="#052e16" stroke="#00ff88" stroke-width="1"/>
      <text x="24" y="22" font-weight="800" fill="#00ff88" letter-spacing="1">
        ✔ SYSTEM STATUS: AUTONOMOUS INCIDENT PIPELINE FULLY OPERATIONAL
      </text>
      <text x="760" y="22" font-weight="700" fill="#a7f3d0" text-anchor="end">0.78s LATENCY</text>
      <rect class="cursor-blink" x="772" y="10" width="8" height="15" fill="#00ff88"/>
    </g>
  </g>
</svg>
