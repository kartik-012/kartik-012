<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <style>
      @keyframes appear1  { 0%,10%  { opacity:0 } 11%,100% { opacity:1 } }
      @keyframes appear2  { 0%,18%  { opacity:0 } 19%,100% { opacity:1 } }
      @keyframes appear3  { 0%,26%  { opacity:0 } 27%,100% { opacity:1 } }
      @keyframes appear4  { 0%,34%  { opacity:0 } 35%,100% { opacity:1 } }
      @keyframes appear5  { 0%,42%  { opacity:0 } 43%,100% { opacity:1 } }
      @keyframes appear6  { 0%,50%  { opacity:0 } 51%,100% { opacity:1 } }
      @keyframes appear7  { 0%,60%  { opacity:0 } 61%,100% { opacity:1 } }
      @keyframes blink    { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes scanline { 0% { transform:translateY(0); opacity:0.05; } 100% { transform:translateY(360px); opacity:0.05; } }
      @keyframes systemReady { 0%,64% { opacity:0 } 65%,80% { opacity:1; fill:#00ff88 } 81%,90% { opacity:0.3 } 91%,100% { opacity:1; fill:#00ff88 } }
      .line1 { animation: appear1 12s steps(1) infinite; }
      .line2 { animation: appear2 12s steps(1) infinite; }
      .line3 { animation: appear3 12s steps(1) infinite; }
      .line4 { animation: appear4 12s steps(1) infinite; }
      .line5 { animation: appear5 12s steps(1) infinite; }
      .line6 { animation: appear6 12s steps(1) infinite; }
      .line7 { animation: appear7 12s steps(1) infinite; }
      .cursor { animation: blink 0.8s steps(1) infinite; }
      .system-ready { animation: systemReady 12s steps(1) infinite; }
    </style>
  </defs>

  <!-- Terminal background -->
  <rect width="900" height="380" rx="12" fill="#0d1117" stroke="#00ff88" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect width="900" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="900" height="12" fill="#161b22"/>
  <!-- Traffic lights -->
  <circle cx="22" cy="18" r="6" fill="#f43f5e"/>
  <circle cx="42" cy="18" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="18" r="6" fill="#00ff88"/>
  <!-- Title -->
  <text x="450" y="23" font-family="'Courier New', monospace" font-size="12" fill="#8b949e" text-anchor="middle">kartik@neural-system: ~/boot</text>

  <!-- Scanline effect -->
  <rect width="900" height="8" fill="#00ff88" opacity="0" style="animation: scanline 4s linear infinite;"/>

  <!-- Prompt line -->
  <text x="30" y="68" font-family="'Courier New', monospace" font-size="13" fill="#00ff88">
    <tspan fill="#a855f7">kartik</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#06b6d4">neural-sys</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">./boot_system.sh</tspan>
  </text>

  <!-- Boot lines -->
  <text class="line1" x="30" y="100" font-family="'Courier New', monospace" font-size="13" fill="#e6edf3">
    <tspan fill="#00ff88">[  OK  ]</tspan><tspan> Initializing Kafka KRaft cluster...</tspan>
  </text>
  <text class="line2" x="30" y="126" font-family="'Courier New', monospace" font-size="13" fill="#e6edf3">
    <tspan fill="#00ff88">[  OK  ]</tspan><tspan> pgvector index loaded — 2580 chunks</tspan>
  </text>
  <text class="line3" x="30" y="152" font-family="'Courier New', monospace" font-size="13" fill="#e6edf3">
    <tspan fill="#00ff88">[  OK  ]</tspan><tspan> gRPC services online — HTTP/2 multiplexing</tspan>
  </text>
  <text class="line4" x="30" y="178" font-family="'Courier New', monospace" font-size="13" fill="#e6edf3">
    <tspan fill="#00ff88">[  OK  ]</tspan><tspan> Redis cache warm — hit rate 94.2%</tspan>
  </text>
  <text class="line5" x="30" y="204" font-family="'Courier New', monospace" font-size="13" fill="#e6edf3">
    <tspan fill="#00ff88">[  OK  ]</tspan><tspan> Prometheus scraping /metrics every 15s</tspan>
  </text>
  <text class="line6" x="30" y="230" font-family="'Courier New', monospace" font-size="13" fill="#e6edf3">
    <tspan fill="#00ff88">[  OK  ]</tspan><tspan> AIOps RCA engine ready — 780ms MTTR</tspan>
  </text>
  <text class="line7" x="30" y="256" font-family="'Courier New', monospace" font-size="13" fill="#e6edf3">
    <tspan fill="#f59e0b">[ INFO ]</tspan><tspan> FastAPI uvicorn workers: 4 | PORT: 8000</tspan>
  </text>

  <!-- Separator -->
  <line class="line7" x1="30" y1="274" x2="870" y2="274" stroke="#00ff88" stroke-width="0.5" opacity="0.4"/>

  <!-- SYSTEM READY -->
  <text class="system-ready" x="30" y="308" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#00ff88" letter-spacing="4">SYSTEM READY</text>

  <!-- Uptime / stats -->
  <text class="line7" x="30" y="340" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">uptime: 0d 00:00:01 | mem: 2.1GB/8GB | cpu: 4.2% | net: ONLINE</text>

  <!-- Cursor -->
  <text class="line7" x="30" y="365" font-family="'Courier New', monospace" font-size="13" fill="#00ff88">
    <tspan fill="#a855f7">kartik</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#06b6d4">neural-sys</tspan><tspan fill="#8b949e">:~$ </tspan><tspan class="cursor">█</tspan>
  </text>
</svg>
